<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照片瀏覽器</title>
<!--
  照片瀏覽器（單一檔案，不需安裝）
  - 用 Chrome 或 Edge 打開這個檔案，選擇照片資料夾即可
  - 拖照片到左側資料夾 = 真的搬移檔案（可在左側新增資料夾）；拖到標籤 = 加標籤
  - 標籤存在照片資料夾裡的「照片標籤.json」
-->
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #111111; --muted: #78716c; --line: #e7e5e4;
    --hover: #f0efed; --sel: #111111; --on-sel: #ffffff; --size: 160px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --panel: #1c1917; --text: #fafaf9; --muted: #a8a29e; --line: #292524;
            --hover: #292524; --sel: #fafaf9; --on-sel: #111111; }
  }
  * { box-sizing: border-box; }
  /* 下面有些元素自己設了 display（grid 等），會蓋掉 hidden 屬性，所以這裡強制 hidden 一定隱藏 */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); overflow: hidden;
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
           border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--sel); color: var(--on-sel); border-color: var(--sel); font-weight: 600; }

  /* ---- 開始畫面 ---- */
  #start { position: fixed; inset: 0; display: grid; place-items: center; z-index: 40; background: var(--bg); }
  #start .box { max-width: 460px; padding: 32px; text-align: center; }
  #start h1 { font-size: 24px; margin: 0 0 8px; }
  #start p { color: var(--muted); margin: 0 0 20px; }
  #start .btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #start .btns button { padding: 10px 20px; font-size: 14px; min-width: 260px; }
  #start .warn { color: #dc2626; }

  /* ---- 版面 ---- */
  #app { display: grid; grid-template-columns: 250px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
          padding: 12px 8px 20px; user-select: none; }
  .sbtitle { display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 6px;
             font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .05em; }
  .sbtitle button { padding: 0 8px; font-size: 15px; line-height: 20px; border: none; background: none; }
  .row { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 7px; cursor: pointer;
         white-space: nowrap; border: 2px solid transparent; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--sel); color: var(--on-sel); }
  .row.active .cnt, .row.active .key { color: var(--on-sel); opacity: .75; }
  .row.over { border-color: var(--sel); background: var(--hover); color: var(--text); }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row .cnt { color: var(--muted); font-size: 11px; }
  .row .tw { width: 14px; text-align: center; color: var(--muted); flex: none; font-size: 10px; }
  .row .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .row .key { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .row.add { color: var(--muted); }
  .help { margin: 18px 8px 0; color: var(--muted); font-size: 11px; line-height: 1.8; }
  .help kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font: inherit; }

  #main { overflow-y: auto; position: relative; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap; }
  header h2 { font-size: 16px; margin: 0; }
  header .info { color: var(--muted); }
  header .spacer { flex: 1; }
  header input[type=range] { width: 110px; accent-color: var(--sel); }

  #grid { padding: 4px 16px 60px; }
  .day { margin-top: 14px; }
  .dayhead { display: inline-flex; gap: 8px; align-items: baseline; padding: 4px 6px; margin: 0 0 6px -6px;
             border-radius: 6px; cursor: pointer; user-select: none; }
  .dayhead:hover { background: var(--hover); }
  .dayhead .dlabel { font-weight: 700; font-size: 14px; }
  .dayhead .dcount { color: var(--muted); font-size: 12px; }
  .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--size), 1fr)); gap: 6px; }
  .cell { aspect-ratio: 1; position: relative; border-radius: 6px; overflow: hidden; background: var(--hover);
          user-select: none; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .cell img:not([src]) { visibility: hidden; }
  .cell.sel { outline: 3px solid var(--sel); outline-offset: 2px; }
  .cell.sel::after { content: "✓"; position: absolute; top: 6px; right: 6px; width: 22px; height: 22px;
                     border-radius: 50%; background: var(--sel); color: var(--on-sel); display: grid;
                     place-items: center; font-size: 13px; font-weight: 700; }
  .cell.cur:not(.sel) { outline: 2px dashed var(--muted); outline-offset: 2px; }
  .cell .vid { position: absolute; bottom: 6px; right: 6px; background: #000a; color: #fff; font-size: 10px;
               padding: 1px 6px; border-radius: 4px; }
  .cell .dots { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 3px; }
  .cell .dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #fff; }
  .cell.fail::before { content: "無法預覽"; position: absolute; inset: 0; display: grid; place-items: center;
                       color: var(--muted); font-size: 11px; }
  .empty { padding: 80px 0; text-align: center; color: var(--muted); }

  /* ---- 大圖檢視 ---- */
  #viewer { position: fixed; inset: 0; background: #000; z-index: 30; display: none; }
  #viewer.show { display: block; }
  #vstage { position: absolute; inset: 0; display: grid; place-items: center; }
  #vstage img, #vstage video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .vbar { position: absolute; left: 0; right: 0; padding: 12px 18px; color: #fff; display: flex; gap: 10px;
          align-items: center; flex-wrap: wrap; transition: opacity .25s; }
  #vtop { top: 0; background: linear-gradient(#000c, #0000); }
  #vbottom { bottom: 0; background: linear-gradient(#0000, #000c); justify-content: center; }
  #viewer.idle .vbar, #viewer.idle .vnav { opacity: 0; }
  #vinfo { flex: 1; font-size: 13px; }
  #viewer button { background: #fff2; color: #fff; border-color: #fff3; }
  #viewer button:hover { background: #fff4; }
  .vnav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 26px !important;
          padding: 14px 10px !important; transition: opacity .25s; }
  #vprev { left: 12px; } #vnext { right: 12px; }
  .chip { display: inline-flex; gap: 6px; align-items: center; border-radius: 99px !important; padding: 4px 12px !important; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.on { background: #fff !important; color: #111 !important; font-weight: 600; }
  .chip small { opacity: .6; }

  #busy, #toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; border-radius: 10px;
                  padding: 10px 18px; background: var(--sel); color: var(--on-sel); }
  #busy { top: 40%; display: none; }
  #toast { bottom: 24px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80vw; }
  #toast.show { opacity: 1; }
  #dragghost { position: fixed; top: -100px; left: 0; padding: 6px 12px; border-radius: 8px;
               background: var(--sel); color: var(--on-sel); font-weight: 600; }

  #app { min-width: 0; }
  #main { min-width: 0; }
  #viewer { background: #151515f5; }
  #vstage { inset: 72px 64px 80px; overflow: hidden; touch-action: none; }
  #vstage img, #vstage video { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
  #vstage img { transform: translate(var(--pan-x, 0px), var(--pan-y, 0px)) scale(var(--zoom, 1)); cursor: grab; }
  #vtop, #vbottom { background: #151515; }
  #viewer.idle .vbar, #viewer.idle .vnav { opacity: 1; }
  .pickmark { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; padding: 0; border-radius: 50%; background: #0006; color: white; z-index: 2; }
  .cell.sel::after { display: none; }
  .cell.sel .pickmark { background: var(--sel); color: var(--on-sel); }
  .cell:not(.sel):not(:hover) .pickmark { opacity: .4; }
  #grid.selecting { touch-action: none; }
  #marquee { position: fixed; border: 1px solid #4285f4; background: #4285f426; pointer-events: none; z-index: 10; }
  body.mobile #app, body.mobile #viewer { width: min(100%, 430px); margin: auto; }
  body.mobile #app { grid-template-columns: 1fr; height: 100dvh; }
  body.mobile aside { display: none; }
  body.mobile.menu-open aside { display: block; position: fixed; inset: 0 auto 0 auto; width: min(85vw, 340px); z-index: 20; }
  body.mobile header { gap: 8px; padding: 10px; }
  body.mobile header h2 { width: calc(100% - 70px); }
  body.mobile header button { min-height: 40px; }
  body.mobile header input { width: 75px; }
  body.mobile #grid { padding: 0 8px 60px; }
  body.mobile .cells { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  body.mobile .dayhead .dlabel { font-size: 12px; }
  body.mobile .pickmark { opacity: 1 !important; }
  body.mobile #vstage { inset: 130px 8px 100px; }
  body.mobile #vtop { padding: 10px; gap: 6px; }
  body.mobile #vinfo { flex-basis: 100%; font-size: 11px; }
  body.mobile .vnav { padding: 8px !important; }
  body.mobile #vprev { left: 4px; } body.mobile #vnext { right: 4px; }
  #btnMenu { display: none; } body.mobile #btnMenu { display: block; }
  .verror { color: white; text-align: center; padding: 20px; }

  #app { grid-template-columns: 250px minmax(0, 1fr) 120px; }
  header { display: block; padding: 0; }
  .title-row, .view-row, .selection-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .title-row { justify-content: space-between; }
  .title-copy { flex: 1; min-width: 0; }
  .title-copy h2 { margin-bottom: 3px; overflow-wrap: anywhere; }
  .title-copy .info { font-size: 12px; margin-right: 5px; }
  .view-row { border-top: 1px solid var(--line); padding-block: 8px; flex-wrap: wrap; }
  .selection-row { background: var(--hover); flex-wrap: wrap; font-size: 12px; }
  .selection-row span { flex: 1; }
  .tool-label { color: var(--muted); font-size: 11px; }
  .size-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .pickmark { display: none; }
  body.selection-active .pickmark { display: grid; place-items: center; opacity: 1 !important; }
  body.selection-active .cell:not(.sel) .pickmark { font-size: 0; border: 2px solid #fff; background: #0003; }
  .side-heading { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 12px; }
  #btnCloseSide { display: none; }
  .side-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
  .side-tools button { font-size: 12px; }
  #timeline { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); padding: 16px 10px; background: var(--panel); overflow: hidden; overscroll-behavior: contain; }
  .timeline-title { font-size: 11px; font-weight: 700; color: var(--muted); }

  #timelineNodes { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }


  #timelineNodes button { display: block; width: 100%; border: none; border-left: 2px solid var(--line); border-radius: 0 6px 6px 0; background: none; text-align: left; margin-left: 3px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
  #timelineNodes button[aria-current="date"] { border-left-color: var(--sel); background: var(--hover); color: var(--text); font-weight: 700; }
  #sideBackdrop { position: fixed; inset: 0; background: #0006; border: 0; border-radius: 0; z-index: 19; }
  body.mobile #app { grid-template-columns: minmax(0, 1fr) 60px; }
  body.mobile.menu-open aside { left: max(0px, calc((100vw - 430px) / 2)); top: 0; bottom: 0; right: auto; height: 100dvh; }
  body.mobile #btnCloseSide { display: block; min-width: 40px; min-height: 40px; }
  body.mobile header { padding: 0; }
  body.mobile .title-copy h2 { width: auto; font-size: 14px; }
  body.mobile .title-row, body.mobile .view-row, body.mobile .selection-row { padding: 8px; gap: 6px; }
  body.mobile header button { font-size: 11px; padding: 5px 7px; }
  body.mobile .view-row .tool-label { display: none; }
  body.mobile header input { width: 65px; }
  body.mobile .cells { grid-template-columns: repeat(var(--mobile-cols, 3), minmax(0, 1fr)); }
  body.mobile #timeline { padding: 12px 4px; }

  body.mobile #timelineNodes button { padding: 8px 3px; font-size: 10px; }

  /* Explicit grid tracks prevent a large image's intrinsic dimensions from cropping the fit view. */
  #viewer.show { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: #151515; }
  #vtop { position: static; grid-row: 1; }
  #vbottom { position: static; grid-row: 3; max-height: 25dvh; overflow-y: auto; }
  #vstage, body.mobile #vstage { position: relative; grid-row: 2; inset: auto; min-width: 0; min-height: 0; display: block; margin: 16px 64px; }
  body.mobile #vstage { margin: 10px 8px; }
  #vstage img, #vstage video { position: absolute; inset: 0; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }
  .title-row { flex-wrap: wrap; }
  .view-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .view-controls > .tool-label { display: none; }
  .side-heading { position: relative; gap: 8px; }
  #settings { margin-left: 0; }
  .side-heading > strong { margin-right: auto; white-space: nowrap; }
  #btnMode { padding: 7px 8px; font-size: 11px; white-space: nowrap; min-height: 36px; }
  body.mobile .side-heading { flex-wrap: wrap; }
  #settings summary { cursor: pointer; list-style: none; padding: 5px 10px; font-size: 18px; border: 1px solid var(--line); border-radius: 7px; }
  #settings summary::-webkit-details-marker { display: none; }
  .settings-panel { position: absolute; top: 48px; left: 8px; right: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; z-index: 21; display: grid; gap: 4px; }
  .settings-panel button { text-align: left; padding: 9px 10px; border: 0; }
  #timelineNodes section { margin: 6px 0 14px; }
  #timelineNodes h3 { margin: 0; padding: 8px 0; font-size: 12px; font-weight: 700; }
  body.mobile .view-controls { margin-left: auto; }
  body.mobile .size-label { font-size: 10px; gap: 4px; }
  body.mobile .view-controls input { width: 45px; }
  body.mobile #timelineNodes h3 { font-size: 11px; }
  body.mobile { background: var(--hover); }
  body.mobile #app, body.mobile #viewer { border-inline: 1px solid var(--line); }
</style>
</head>
<body>

<div id="start">
  <div class="box">
    <h1>照片瀏覽器</h1>
    <p>選擇一個照片資料夾開始。拖照片到左側資料夾就會搬移檔案，拖到標籤就能整理成相簿。</p>
    <div class="btns">
      <button id="resume" class="primary" hidden></button>
      <button id="pick">選擇照片資料夾…</button>
    </div>
    <p id="unsupported" class="warn" hidden><br>這個瀏覽器不支援讀寫資料夾，請改用 <b>Chrome</b> 或 <b>Edge</b> 打開這個檔案。</p>
  </div>
</div>

<div id="app" hidden>
  <button id="sideBackdrop" hidden aria-label="關閉側邊欄"></button>
  <aside id="side">
    <div class="side-heading"><strong>照片圖庫</strong>
      <button id="btnMode" title="切換手機或桌機版面">切換手機</button>
      <details id="settings"><summary aria-label="設定" title="設定">⚙</summary>
        <div class="settings-panel">
          <button id="btnChange">換資料夾</button><button id="btnNewFolder">新增資料夾</button>
          <button id="btnRescan">重新整理</button><button id="btnRetry">重試預覽</button>
        </div>
      </details>
      <button id="btnCloseSide" aria-label="關閉側邊欄">✕</button>
    </div>
    <div class="sbtitle">資料夾</div>
    <div id="folders"></div>
    <div class="sbtitle">標籤（相簿） <button id="btnNewTag" title="新增標籤">＋</button></div>
    <div id="tags"></div>
    <div class="help">
      <b>操作方式</b><br>
      點照片＝預覽；長按＝選取<br><kbd>⌘</kbd> 加選／<kbd>Shift</kbd> 連選<br>
      勾選圓圈／多選按鈕＝加選<br>空白處拖曳＝框選；多選時滑過照片＝連選<br>手機：長按後滑動連選；雙指縮放大圖<br>點日期標題＝選整天<br>
      拖到資料夾＝搬移檔案<br>
      拖到標籤＝加標籤<br>
      <kbd>1</kbd>–<kbd>9</kbd> 加／取消標籤<br>
      <kbd>空白鍵</kbd> 或雙擊＝看大圖<br>
      <kbd>← →</kbd> 上一張／下一張<br>
      <kbd>⌘</kbd><kbd>Z</kbd> 復原搬移
    </div>
  </aside>
  <div id="main">
    <header>
      <div class="title-row">
        <button id="btnMenu" aria-label="資料夾與標籤" aria-expanded="false" aria-controls="side">☰</button>
        <div class="title-copy"><h2 id="title"></h2><span class="info" id="count"></span><span class="info" id="selinfo" aria-live="polite"></span></div>
      <div class="view-controls" aria-label="檢視與排序">
        <span class="tool-label">檢視</span><label class="size-label">縮圖 <input type="range" id="size" min="90" max="360" value="160" title="縮圖大小"></label>
        <button id="btnSort"></button>
      </div>
        <button id="btnMulti" aria-pressed="false">選取／分類</button>
      </div>
      <div id="selectionTools" class="selection-row" hidden>
        <span>選取照片後，可拖到左側資料夾或標籤分類</span>
        <button id="btnTrash">移到垃圾桶</button><button id="btnClear">清除選取</button>
        <button id="btnUndo" title="復原上一次搬移 (⌘Z)">↶ 復原搬移</button>
      </div>
    </header>
    <div id="grid"></div>
  </div>
  <nav id="timeline" aria-label="照片時間軸">
    <div class="timeline-title">時間軸</div>
    <div id="timelineNodes"></div>
  </nav>
</div>

<div id="viewer">
  <div id="vstage"></div>
  <button class="vnav" id="vprev">‹</button>
  <button class="vnav" id="vnext">›</button>
  <div class="vbar" id="vtop"><span id="vinfo"></span><button id="vminus" aria-label="縮小">−</button><button id="vfit">適合視窗</button><button id="vplus" aria-label="放大">＋</button><button id="vtrash">移到垃圾桶</button><button id="vclose">關閉 (Esc)</button></div>
  <div class="vbar" id="vbottom"></div>
</div>

<div id="busy"></div>
<div id="toast"></div>
<div id="dragghost"></div><div id="marquee" hidden></div>

<script>
const $ = s => document.querySelector(s);
const TAGFILE = '照片標籤.json';
const TRASH = '垃圾桶';
const inTrash = p => p.dir === TRASH || p.dir.startsWith(TRASH + '/');
const THUMB_W = 512;
const PALETTE = ['#e11d48', '#ea580c', '#ca8a04', '#16a34a', '#0891b2', '#2563eb', '#7c3aed', '#db2777', '#57534e'];
const KINDS = { img: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'avif'], heic: ['heic', 'heif'], video: ['mov', 'mp4', 'm4v', 'webm'] };
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

let multi = false;
let mobile = localStorage.getItem('photo-layout') === 'mobile' || (!localStorage.getItem('photo-layout') && innerWidth < 600);
let root = null;
const dirs = new Map();          // 路徑 → { handle, path, name, children[] }
let photos = [];                 // 全部照片
let list = [];                   // 目前畫面上的照片（篩選＋排序後）
let filter = { type: 'folder', value: '' };
let sortAsc = true;
let sel = new Set(), anchor = -1, cursor = -1;
let anchorEnd = -1;              // 點日期標題選整天時，那一天最後一張的位置（給 Shift 連選用）
const cells = new Map();
const collapsed = new Set();
let tagData = { tags: [], colors: {}, photos: {} };
const undoStack = [];
let nextId = 1;

// ---------- 小工具 ----------
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayLabel = d => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（週${WEEK[d.getDay()]}）`;
const fmtDate = d => `${dayKey(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

// ---------- 開啟資料夾 ----------
async function walk(h, path, out) {
  const node = { handle: h, path, name: path ? path.slice(path.lastIndexOf('/') + 1) : h.name, children: [] };
  dirs.set(path, node);
  const subs = [];
  for await (const [name, ch] of h.entries()) {
    if (name.startsWith('.')) continue;
    if (ch.kind === 'directory') subs.push([name, ch]);
    else { const k = kindOf(name); if (k) out.push({ name, dir: path, handle: ch, kind: k }); }
  }
  subs.sort((a, b) => byName(a[0], b[0]));
  for (const [name, ch] of subs) {
    const cp = path ? path + '/' + name : name;
    node.children.push(cp);
    await walk(ch, cp, out);
  }
}

    p.key = `${p.name}|${p.size}`; p.cacheKey = `v2|${h.name}|${f.dir}|${p.key}|${file.lastModified}`;

async function ensureTrash() {
  if (dirs.has(TRASH)) return dirs.get(TRASH);
  const handle = await root.getDirectoryHandle(TRASH, {create:true});
  const node = {handle, path:TRASH, name:TRASH, children:[]}; dirs.set(TRASH, node);
  const parent = dirs.get(''); if (parent && !parent.children.includes(TRASH)) parent.children.push(TRASH);
  return node;
}
async function trashPhotos(ps) {
  const todo = ps.filter(p => !inTrash(p));
  if (!todo.length) return toast('請先選取要移到垃圾桶的照片');
  try { await ensureTrash(); await movePhotos(todo, TRASH); }
  catch (e) { toast('無法移到垃圾桶：' + e.message); }
}

async function exists(dirH, name) { try { await dirH.getFileHandle(name); return true; } catch (e) { return false; } }
async function freeName(dirH, name) {
  if (!await exists(dirH, name)) return name;
  const dot = name.lastIndexOf('.'), base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
  for (let i = 1; ; i++) { const n = `${base}_${i}${ext}`; if (!await exists(dirH, n)) return n; }
}
async function moveOne(p, dest, wantName = p.name) {
  const src = dirs.get(p.dir);
  const newName = await freeName(dest.handle, wantName);
  let ok = false;
  if (typeof p.handle.move === 'function') { try { await p.handle.move(dest.handle, newName); ok = true; } catch (e) {} }
  if (!ok) {
    // 瀏覽器不支援直接搬移時：先完整複製、確認大小一致，再刪除原檔
    const file = await p.handle.getFile();
    const nh = await dest.handle.getFileHandle(newName, { create: true });
    const w = await nh.createWritable(); await w.write(file); await w.close();
    if ((await nh.getFile()).size !== file.size) { await dest.handle.removeEntry(newName); throw new Error('複製不完整'); }
    await src.handle.removeEntry(p.name);
  }
  const oldKey = p.key;
  p.handle = await dest.handle.getFileHandle(newName);
  p.dir = dest.path; p.name = newName; p.key = `${newName}|${p.size}`;
  if (oldKey !== p.key && tagData.photos[oldKey]) { tagData.photos[p.key] = tagData.photos[oldKey]; delete tagData.photos[oldKey]; saveTags(); }
}

  const todo = ps.filter(p => p.dir !== destPath);
  if (!todo.length) return toast('照片已經在這個資料夾裡了');
  busy(`搬移 ${todo.length} 張…`);
  const done = []; let fail = 0;
  for (const p of todo) {
    const from = { dir: p.dir, name: p.name };
    try { await moveOne(p, dest); done.push({ p, ...from }); } catch (e) { console.error(e); fail++; }
  }
  busy('');
  if (done.length) undoStack.push(done);
  toast(`已搬移 ${done.length} 張到「${dest.name}」` + (fail ? `，${fail} 張失敗` : '') + '（⌘Z 可復原）');
  applyFilter();
}

  const u = undoStack.pop();
  if (!u) return toast('沒有可以復原的搬移');
  busy('復原中…');
  for (const it of [...u].reverse()) { try { await moveOne(it.p, dirs.get(it.dir), it.name); } catch (e) { console.error(e); } }
  busy('');
  toast(`已復原，${u.length} 張移回原本的資料夾`);
  applyFilter();
}

    Object.assign(box.style, {left: left+'px', top: (top-delta)+'px', width: (right-left)+'px', height: (bottom-top)+'px'});
    sel = new Set(g.add ? g.base : []);
    for (const {id,rect:r} of g.boxes) if (r.right > left && r.left < right && r.bottom > top && r.top < bottom) sel.add(id);
  }
  updateSel();
}
function autoScroll() {
  const g = gesture; if (!g?.active) return;
  const main = $('#main'), r = main.getBoundingClientRect(), top = r.top + main.querySelector('header').offsetHeight;
  const dy = g.y < top + 35 ? -14 : g.y > r.bottom - 35 ? 14 : 0;
  if (dy) { main.scrollTop += dy; sweep(g); }
  scrollFrame = requestAnimationFrame(autoScroll);
}
grid.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('button,.dayhead')) return;
  const c = e.target.closest('.cell'), touch = e.pointerType === 'touch' || mobile;
  const g = gesture = {id:e.pointerId, sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY, touch, range:!!c, first:c ? +c.dataset.i : -1, last:c ? +c.dataset.i : -1, base:new Set(sel), remove:c && sel.has(list[+c.dataset.i].id), add:e.metaKey || e.ctrlKey || multi};
  if (c && !multi) g.timer = setTimeout(() => activateGesture(g), 380);
});
window.addEventListener('pointermove', e => {
  const g = gesture; if (!g || e.pointerId !== g.id) return;
  g.x = e.clientX; g.y = e.clientY;
  if (!g.active && Math.hypot(g.x-g.sx,g.y-g.sy) > 6) {
    clearTimeout(g.timer);
    if (!multi && (g.touch || g.range)) { gesture = null; return; }
    activateGesture(g);
  }
  if (g.active) { e.preventDefault(); sweep(g); }
}, {passive:false});
function endGesture(e) {
  const g = gesture; if (!g || e.pointerId !== g.id) return;
  clearTimeout(g.timer); cancelAnimationFrame(scrollFrame);
  if (grid.hasPointerCapture(g.id)) grid.releasePointerCapture(g.id);
  $('#marquee').hidden = true; gesture = null;
  if (g.active) setTimeout(() => suppressClick = false, 0);
}
window.addEventListener('pointerup', endGesture);
window.addEventListener('pointercancel', endGesture);
grid.addEventListener('touchmove', e => { if (gesture?.active) e.preventDefault(); }, {passive:false});
grid.addEventListener('contextmenu', e => { if (mobile || multi || gesture?.active) e.preventDefault(); });

// ---------- 大圖：按鈕／滾輪／雙指縮放、放大後拖動、左右滑動 ----------
let zoom = 1, panX = 0, panY = 0;
const touches = new Map(); let viewGesture;
function setZoom(z) {
  zoom = Math.max(1, Math.min(8, z)); if (zoom === 1) panX = panY = 0;
  const stage = $('#vstage'); stage.style.setProperty('--zoom', zoom);
  stage.style.setProperty('--pan-x', panX+'px'); stage.style.setProperty('--pan-y', panY+'px');
  $('#vfit').textContent = zoom === 1 ? '適合視窗' : Math.round(zoom*100)+'%';
}
$('#vplus').onclick = () => setZoom(zoom*1.25);
$('#vminus').onclick = () => setZoom(zoom/1.25);
$('#vfit').onclick = () => setZoom(1);
const stage = $('#vstage');
stage.addEventListener('wheel', e => { if (!stage.querySelector('img')) return; e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY*.002)); }, {passive:false});
stage.addEventListener('dblclick', () => setZoom(zoom === 1 ? 2 : 1));
stage.addEventListener('pointerdown', e => {
  if (!stage.querySelector('img')) return;
  stage.setPointerCapture(e.pointerId); touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts = [...touches.values()];
  viewGesture = {x:e.clientX,y:e.clientY,px:panX,py:panY,z:zoom,d:pts.length===2 ? Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y) : 0, pinch:pts.length>1};
});
stage.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId) || !viewGesture) return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY}); const pts=[...touches.values()], g=viewGesture;
  if (pts.length===2 && g.d) setZoom(g.z*Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)/g.d);
  else if (zoom>1) { panX=g.px+e.clientX-g.x; panY=g.py+e.clientY-g.y; setZoom(zoom); }
});
function endView(e) {
  const g=viewGesture; if (!touches.has(e.pointerId)) return;
  touches.delete(e.pointerId);
  if (e.type !== 'pointercancel' && !g?.pinch && zoom===1 && Math.abs(e.clientX-g.x)>60 && Math.abs(e.clientY-g.y)<80) {
    vi=Math.max(0,Math.min(list.length-1,vi+(e.clientX<g.x?1:-1))); showV();
  }
  if (touches.size) { const p=[...touches.values()][0]; viewGesture={x:p.x,y:p.y,px:panX,py:panY,z:zoom,pinch:true}; }
  else viewGesture=null;
}
stage.addEventListener('pointerup',endView); stage.addEventListener('pointercancel',endView);

// ---------- 開始 ----------
async function pick() {
  try {
    const h = await showDirectoryPicker({ id: 'photos', mode: 'readwrite' });
    await idbSet('kv', 'root', h);
    openRoot(h);
  } catch (e) { if (e.name !== 'AbortError') toast('無法開啟資料夾：' + e.message); }
}
(async () => {
  if (!window.showDirectoryPicker) { $('#unsupported').hidden = false; $('#pick').disabled = true; return; }
  $('#pick').onclick = pick;
  const h = await idbGet('kv', 'root');
  if (h) {
    const r = $('#resume'); r.hidden = false; r.textContent = `繼續開啟「${h.name}」`;
    r.onclick = async () => {
      try {
        if (await h.requestPermission({ mode: 'readwrite' }) === 'granted') openRoot(h);
      } catch (e) { toast('找不到上次的資料夾，請重新選擇'); }
    };
  }
})();
</script>
