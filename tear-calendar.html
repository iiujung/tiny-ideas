      window.addEventListener("resize", () => {
        clearTimeout(t);
        t = setTimeout(() => {
          // 手機網址列收合只差幾十 px，不重畫
          if (window.innerWidth === lastW && Math.abs(window.innerHeight - lastH) < 120) return;
          lastW = window.innerWidth; lastH = window.innerHeight; paint();
        }, 160);
      });
    }
    return { init };
  })();

  // ───────── 3D 層：牆上那本日曆用 three.js 畫；載入不了、跑不動就留在上面的 CSS 版 ─────────
  // 平常看 3D，要畫的時候鏡頭拉正、換回 DOM 的平面畫布，所以畫圖、存檔的程式完全不用動
  const T3 = (() => {
    const root = document.documentElement;
    const query = new URLSearchParams(location.search);
    // 可以調的數字都在這：1 個世界單位 = 一張紙的寬
    const FOV = 24, TEX_W = 1024, NX = 44, NY = 60;
    const LOAD_TIMEOUT = 6000, TEAR_MS = 1250, CAM_MS = 520, INTRO_S = 2.85;
    const ARM = 0.42;              // 拖過這個距離放開才會撕
    const STACK_Z = 0.1;           // 紙疊離牆多遠
    const BOARD_D = 0.2;           // 裝訂條多厚
    const NAIL_Z = STACK_Z + BOARD_D + 0.004; // 掛繩掛在裝訂條前緣，不被板子擋住
    const STUB_PX = 13;            // 撕線離紙頂幾 px，以上留在日曆上
    const TILT = { x: 0.1, y: -0.4 }; // 鏡頭在日曆右下一點點，稍微仰視
    const depthFor = (under) => 0.03 + 0.14 * Math.min(1, under / 30); // 紙疊厚度跟著剩幾頁走
    const SHADOW = 0.6, SHADOW_AIR = 0.3; // 紙在空中時影子淡一點
    const SANS = '"Huninn", "jf-openhuninn-2.1", "PingFang TC", "Noto Sans TC", sans-serif';
    const MONO = '"JetBrains Mono", ui-monospace, monospace';

    let BACK_TINT = null; // 紙背暗一點，翻起來才看得出來
    let THREE = null, renderer = null, canvas = null, scene = null, camera = null;
    let L = null, cal = null, grainCv = null, grainTex = null;
    const st = {
      ready: false, failed: false, on: false, shown: false, mode: "rest", busy: false, intro: false, skip: false,
      drag: null, dragTear: false, top: null, under: null, spare: null, cam: null,
      par: { x: 0, y: 0, tx: 0, ty: 0, run: false }, queue: Promise.resolve(), frames: [],
    };

    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const easeBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const newCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

    function webglOK() {
      try {
        const g = newCanvas(2, 2).getContext("webgl2");
        if (!g) return false;
        g.getExtension("WEBGL_lose_context")?.loseContext();
        return true;
      } catch { return false; }
    }

    function init() {
      if (query.get("flat") === "1" || !webglOK()) return;
      root.classList.add("t3-wait");
      const late = new Promise((_, rej) => setTimeout(() => rej(new Error("three 載入逾時")), LOAD_TIMEOUT));
      Promise.race([import("three"), late])
        .then((m) => { THREE = m; setup(); st.ready = true; if (S.store) afterRender(); })
        .catch(() => giveUp());
    }

    // 退回 CSS 版：畫面上的 DOM 本來就在，拿掉 3D 的 class 就回來了
    function giveUp() {
      st.failed = true; st.on = false; st.ready = false;
      root.classList.remove("t3-wait", "t3", "t3-rest", "t3-fly", "t3-draw");
      try { renderer?.dispose(); } catch {}
      canvas?.remove();
    }

    // ───── 紙紋：程式畫的纖維和小點，同時當顏色和凹凸 ─────
    function makeGrain() {
      const n = 512, c = newCanvas(n, n), x = c.getContext("2d");
      x.fillStyle = "#808080"; x.fillRect(0, 0, n, n);
      for (let i = 0; i < 2600; i++) {
        const px = Math.random() * n, py = Math.random() * n, a = Math.random() * Math.PI, len = 6 + Math.random() * 22;
        x.strokeStyle = `rgba(${Math.random() < 0.5 ? "255,255,255" : "0,0,0"},${0.04 + Math.random() * 0.1})`;
        x.lineWidth = 0.6 + Math.random() * 0.8;
        x.beginPath(); x.moveTo(px, py);
        x.quadraticCurveTo(px + Math.cos(a) * len * 0.5 + 3, py + Math.sin(a) * len * 0.5 - 3, px + Math.cos(a) * len, py + Math.sin(a) * len);
        x.stroke();
      }
      for (let i = 0; i < 9000; i++) {
        x.fillStyle = `rgba(${Math.random() < 0.5 ? "255,255,255" : "0,0,0"},${Math.random() * 0.08})`;
        x.fillRect(Math.random() * n, Math.random() * n, 1.4, 1.4);
      }
      return c;
    }

    function setup() {
      canvas = document.createElement("canvas");
      canvas.id = "scene"; canvas.setAttribute("aria-hidden", "true");
      document.body.prepend(canvas);
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); giveUp(); });

      BACK_TINT = new THREE.Color("#E6EBDC");
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(FOV, 1, 0.5, 60);

      // 左上方一盞暖白主光加柔和環境光，影子落在右下
      scene.add(new THREE.AmbientLight(0xffffff, 2.35));
      const sun = new THREE.DirectionalLight(0xfff7ee, 1.25);
      sun.position.set(-2.6, 2.6, 4.2);
      sun.target.position.set(0, -0.8, 0);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      Object.assign(sun.shadow.camera, { left: -3.2, right: 3.2, top: 3.2, bottom: -3.2, near: 0.5, far: 14 });
      sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.003; sun.shadow.radius = 12; sun.shadow.blurSamples = 16;
      sun.shadow.intensity = SHADOW;
      scene.add(sun, sun.target);
      st.sun = sun;

      grainCv = makeGrain();
      grainTex = new THREE.CanvasTexture(grainCv);
      grainTex.wrapS = grainTex.wrapT = THREE.RepeatWrapping;
      grainTex.repeat.set(1.6, 2.2);

      const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ color: "#5B6B5E", opacity: 0.3 }));
      wall.position.set(0, -1, 0); wall.receiveShadow = true;
      scene.add(wall);

      const nail = new THREE.Group();
      const head = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.028, 0.02, 24), new THREE.MeshLambertMaterial({ color: "#D9C3A0" }));
      head.rotation.x = Math.PI / 2; head.position.z = NAIL_Z + 0.008; head.castShadow = true;
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, NAIL_Z, 12), new THREE.MeshLambertMaterial({ color: "#E3D2B5" }));
      pin.rotation.x = Math.PI / 2; pin.position.z = NAIL_Z / 2; pin.castShadow = true;
      nail.add(head, pin); scene.add(nail);

      window.addEventListener("resize", onResize);
      document.addEventListener("pointerdown", onDown);
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onCancel);
      document.addEventListener("keydown", () => { if (st.intro) st.skip = true; });
      document.fonts?.ready.then(() => { if (st.ready && cal) { cal.boardKey = ""; cal.sheets.forEach((s) => { s.key = ""; }); sync(); } });
    }

    // ───── 畫面迴圈：有動畫才畫，平常不耗電 ─────
    const anims = new Set();
    let raf = 0, lastT = 0, dirty = false;
    function loop(now) {
      raf = 0;
      const dt = Math.min(100, lastT ? now - lastT : 16);
      lastT = now; dirty = false;
      for (const a of [...anims]) if (a(dt) === false) anims.delete(a);
      if (!renderer || !st.on) return;
      renderer.render(scene, camera);
      if (st.intro) watchFrames(dt);
      if (anims.size || dirty) raf = requestAnimationFrame(loop); else lastT = 0;
    }
    const kick = () => { dirty = true; if (!raf) raf = requestAnimationFrame(loop); };
    function anim(ms, fn) {
      return new Promise((res) => {
        let t = 0;
        const a = (dt) => { t += dt; const p = Math.min(1, t / ms); fn(p); if (p >= 1) { res(); return false; } };
        anims.add(a); kick();
      });
    }
    // 開場時量一下幀數，手機撐不住就退回 CSS 版
    function watchFrames(dt) {
      st.frames.push(dt);
      if (st.frames.length !== 46 || query.get("perf") === "0") return;
      const med = st.frames.slice(6).sort((a, b) => a - b)[20];
      if (med > 66) giveUp();
    }

    // ───── 量 DOM，讓 3D 的比例跟平面版一樣 ─────
    function measure() {
      const rest = root.classList.contains("t3-rest");
      root.classList.remove("t3-rest");
      const sheet = $("#app .cal .sheet"), board = $("#app .cal .board"), hanger = $("#app .cal .hanger");
      const px = sheet?.getBoundingClientRect().width || 340;
      const b = board?.getBoundingClientRect();
      const hh = hanger?.getBoundingClientRect().height || 36;
      if (rest) root.classList.add("t3-rest");
      return { px, H: (px + 130) / px, boardW: (b?.width || px + 6) / px, boardH: (b?.height || 80) / px, hangH: hh / px, zig: S.cal.style.corner === "zigzag" };
    }
    const sameL = (a, b) => a && Math.abs(a.px - b.px) < 1 && Math.abs(a.boardH - b.boardH) < 0.004 && a.zig === b.zig;

    // 紙的外形：上緣是撕線的小鋸齒，下緣看風格要不要收據鋸齒。貼圖本身不透明、外形只靠遮罩，邊緣才不會滲出黑點
    function makeCutter(W, H, k, zig) {
      const c = newCanvas(W, H), x = c.getContext("2d");
      const cut = STUB_PX * k, tw = 10 * k, th = 7 * k;
      x.fillStyle = "#FFFFFF"; x.beginPath(); x.moveTo(0, cut);
      for (let px = 0; px < W; px += 7 * k) x.lineTo(px, cut + Math.random() * 3 * k);
      x.lineTo(W, cut);
      if (zig) { x.lineTo(W, H - th); for (let px = W; px > 0; px -= tw) { x.lineTo(px - tw / 2, H); x.lineTo(px - tw, H - th); } }
      else { x.lineTo(W, H); x.lineTo(0, H); }
      x.closePath(); x.fill();
      return c;
    }

    function makeSheet(cutter, maskTex) {
      const W = cutter.width, H = cutter.height;
      const geo = new THREE.PlaneGeometry(1, L.H, NX, NY);
      const base = geo.attributes.position.array.slice();
      const cv = newCanvas(W, H);
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const front = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: tex, alphaMap: maskTex, alphaTest: 0.5, side: THREE.FrontSide, shadowSide: THREE.DoubleSide, bumpMap: grainTex, bumpScale: 1 }));
      const back = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: "#FFFFFF", alphaMap: maskTex, alphaTest: 0.5, side: THREE.BackSide, bumpMap: grainTex, bumpScale: 0.5 }));
      front.castShadow = true; front.receiveShadow = true; back.receiveShadow = true;
      const g = new THREE.Group();
      front.position.set(0.5, -L.H / 2, 0); back.position.copy(front.position);
      g.add(front, back); g.visible = false;
      return { g, geo, base, cv, tex, front, back, key: "", fold: null, wave: null };
    }

    function disposeCal() {
      if (!cal) return;
      cal.pivot.traverse((o) => {
        o.geometry?.dispose();
        for (const m of [].concat(o.material || [])) { m.map?.dispose(); m.alphaMap?.dispose(); m.dispose(); }
      });
      scene.remove(cal.pivot);
      cal = null; st.top = st.under = st.spare = null;
    }

    function buildCal() {
      disposeCal();
      const k = TEX_W / L.px, W = TEX_W, H = Math.round(L.H * TEX_W);
      const pivot = new THREE.Group();
      const yBoard = -L.hangH, ySheet = yBoard - L.boardH + 2 / L.px;
      const cutter = makeCutter(W, H, k, L.zig);
      const mask = newCanvas(W, H), mx = mask.getContext("2d");
      mx.fillStyle = "#000"; mx.fillRect(0, 0, W, H); mx.drawImage(cutter, 0, 0);
      const maskTex = new THREE.CanvasTexture(mask);

      // 板頭：圓角的厚板，貼圖的墨線剛好變成側邊
      const bw = L.boardW, bh = L.boardH, r = 10 / L.px, r2 = 4 / L.px;
      const s = new THREE.Shape();
      s.moveTo(-bw / 2 + r2, -bh); s.lineTo(bw / 2 - r2, -bh); s.quadraticCurveTo(bw / 2, -bh, bw / 2, -bh + r2);
      s.lineTo(bw / 2, -r); s.quadraticCurveTo(bw / 2, 0, bw / 2 - r, 0); s.lineTo(-bw / 2 + r, 0);
      s.quadraticCurveTo(-bw / 2, 0, -bw / 2, -r); s.lineTo(-bw / 2, -bh + r2); s.quadraticCurveTo(-bw / 2, -bh, -bw / 2 + r2, -bh);
      const bGeo = new THREE.ExtrudeGeometry(s, { depth: BOARD_D, bevelEnabled: false, curveSegments: 6 });
      const uv = bGeo.attributes.uv, bp = bGeo.attributes.position;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, (bp.getX(i) + bw / 2) / bw, (bp.getY(i) + bh) / bh);
      const boardCv = newCanvas(TEX_W, Math.round((TEX_W * bh) / bw));
      const boardTex = new THREE.CanvasTexture(boardCv);
      boardTex.colorSpace = THREE.SRGBColorSpace; boardTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const boardSide = new THREE.MeshLambertMaterial({ color: "#FFFFFF" });
      const board = new THREE.Mesh(bGeo, [new THREE.MeshLambertMaterial({ map: boardTex }), boardSide]);
      board.castShadow = true; board.receiveShadow = true;
      const top = new THREE.Group(); // 板頭、掛繩、訂書針一起動
      board.position.set(0, yBoard, STACK_Z);
      top.add(board);
      const stapleMat = new THREE.MeshLambertMaterial({ color: "#9C96A6" });
      for (let i = 0; i < 4; i++) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(16 / L.px, 4 / L.px, 0.006), stapleMat);
        const span = bw - 56 / L.px;
        m.position.set(-span / 2 + (span * i) / 3, yBoard - bh + 9 / L.px, STACK_Z + BOARD_D + 0.002);
        top.add(m);
      }
      const ropeMat = new THREE.MeshLambertMaterial({ color: "#2A2433" });
      const ex = 0.2236 * L.boardW, len = Math.hypot(ex, L.hangH);
      for (const sgn of [-1, 1]) {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.0034, 0.0034, len, 8), ropeMat);
        m.position.set((sgn * ex) / 2, -L.hangH / 2, NAIL_Z - 0.006);
        m.rotation.z = sgn * Math.atan2(ex, L.hangH);
        m.castShadow = true; top.add(m);
      }

      // 紙疊的側邊：一條一條的紙
      const sc = newCanvas(8, 64), sx = sc.getContext("2d");
      sx.fillStyle = "#FFFDF4"; sx.fillRect(0, 0, 8, 64); sx.fillStyle = "#CFD6C3";
      for (let y = 0; y < 64; y += 8) sx.fillRect(0, y, 8, 3);
      const sideTex = new THREE.CanvasTexture(sc);
      sideTex.colorSpace = THREE.SRGBColorSpace; sideTex.wrapS = sideTex.wrapT = THREE.RepeatWrapping; sideTex.repeat.set(1, 9); sideTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const stackMats = [new THREE.MeshLambertMaterial({ color: "#FFFFFF" }), new THREE.MeshLambertMaterial({ map: sideTex })];
      const stack = new THREE.Mesh(new THREE.BufferGeometry(), stackMats);
      stack.castShadow = true; stack.receiveShadow = true;

      // 撕過留在裝訂條下的紙邊，撕線的小孔畫在上面
      const stubH = (STUB_PX + 3) / L.px;
      const stubCv = newCanvas(TEX_W, Math.round(stubH * TEX_W));
      const stubTex = new THREE.CanvasTexture(stubCv);
      stubTex.colorSpace = THREE.SRGBColorSpace; stubTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const stubMask = newCanvas(stubCv.width, stubCv.height), tx = stubMask.getContext("2d");
      tx.fillStyle = "#000"; tx.fillRect(0, 0, stubMask.width, stubMask.height);
      tx.fillStyle = "#FFF"; tx.beginPath(); tx.moveTo(0, 0); tx.lineTo(stubMask.width, 0);
      for (let px = stubMask.width; px >= 0; px -= 6 * k) tx.lineTo(px, stubMask.height - Math.random() * 3 * k);
      tx.closePath(); tx.fill();
      const stub = new THREE.Mesh(new THREE.PlaneGeometry(1, stubH), new THREE.MeshLambertMaterial({ map: stubTex, alphaMap: new THREE.CanvasTexture(stubMask), alphaTest: 0.5 }));
      stub.position.set(0, ySheet - stubH / 2, 0); stub.receiveShadow = true;

      const sheets = [makeSheet(cutter, maskTex), makeSheet(cutter, maskTex), makeSheet(cutter, maskTex)];
      pivot.add(top, stack, stub, ...sheets.map((x) => x.g));
      scene.add(pivot);
      cal = { pivot, top, board, boardSide, boardCv, boardTex, stack, stackMats, stub, stubCv, stubTex, sheets, cutter, ySheet, yBoard, k, depth: -1, topZ: STACK_Z + 0.05, boardKey: "", stubKey: "" };
      [st.top, st.under, st.spare] = sheets;
      setDepth(0.05, true);
      for (const x of sheets) x.g.position.set(-0.5, ySheet, 0);
    }

    function stackShape() {
      const s = new THREE.Shape(), hw = 0.5, y0 = cal.ySheet + 0.02, y1 = cal.ySheet - L.H, tw = 10 / L.px, th = 7 / L.px;
      s.moveTo(-hw, y0); s.lineTo(hw, y0);
      if (L.zig) { s.lineTo(hw, y1 + th); for (let x = hw; x > -hw; x -= tw) { s.lineTo(x - tw / 2, y1); s.lineTo(Math.max(-hw, x - tw), y1 + th); } }
      else { s.lineTo(hw, y1); s.lineTo(-hw, y1); }
      s.closePath();
      return s;
    }
    // 下面還有幾頁，決定紙疊多厚
    function setDepth(d, force) {
      if (!force && Math.abs(d - cal.depth) < 1e-5) return;
      cal.depth = d;
      cal.stack.geometry.dispose();
      cal.stack.geometry = new THREE.ExtrudeGeometry(stackShape(), { depth: Math.max(d, 0.001), bevelEnabled: false });
      cal.stack.position.z = STACK_Z;
      cal.stack.visible = d > 0;
      cal.topZ = STACK_Z + d + 0.002;
      cal.stub.position.z = cal.topZ + 0.0012;
      placeSheets();
    }
    function placeSheets() {
      if (st.top) { st.top.g.position.z = cal.topZ; }
      if (st.under) { st.under.g.position.z = cal.topZ - 0.0014; }
    }

    // ───── 把紙面畫成貼圖 ─────
    async function fontsFor(text) {
      if (!document.fonts?.load) return;
      await Promise.race([Promise.all([document.fonts.load(`400 40px "Huninn"`, text), document.fonts.load(`500 20px "JetBrains Mono"`, "0123456789.")]).catch(() => {}), sleep(900)]);
    }
    const imgCache = new Map();
    function loadImg(src) {
      if (imgCache.has(src)) return imgCache.get(src);
      const p = new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
      if (imgCache.size > 6) imgCache.clear();
      imgCache.set(src, p);
      return p;
    }
    function roundPath(x, l, t, w, h, r) { x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r); x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath(); }
    function grainOver(x, W, H, a) {
      x.save(); x.globalCompositeOperation = "soft-light"; x.globalAlpha = a;
      x.fillStyle = x.createPattern(grainCv, "repeat"); x.fillRect(0, 0, W, H);
      x.restore();
    }

    function describe(cur) {
      const t = todayStr();
      if (cur.kind === "open") {
        const rec = S.days[dayKey(cur.date)], art = hasArt(rec);
        const late = cur.date < t ? `${parse(cur.date).getMonth() + 1}/${parse(cur.date).getDate()} 那頁還沒撕` : "";
        return { kind: "open", date: cur.date, src: art ? imgSrc(rec) : "", stamp: rec?.savedAt || 0, foot: late || (art ? "畫好了，可以撕" : "") };
      }
      if (cur.kind === "tomorrow") return { kind: "lock", date: cur.date, lines: ["明天再來撕下一頁。"], foot: "" };
      if (cur.kind === "notyet") { const d = parse(cur.date); return { kind: "lock", date: cur.date, lines: [`${d.getMonth() + 1} 月 ${d.getDate()} 日開始撕第一頁`], foot: "還沒開始" }; }
      return { kind: "done", lines: [`${S.cal.len} 頁都撕完了。`, `畫了 ${stats().drawn} 張，這本日曆是你自己做的。`], foot: "" };
    }
    // 這頁撕掉之後，底下露出來的是哪一頁
    function pageAfter(date) {
      const k = dayKey(date), keep = S.days[k];
      S.days[k] = { ...keep, torn: true };
      const cur = currentPage();
      if (keep) S.days[k] = keep; else delete S.days[k];
      return cur;
    }

    function drawSheet(cv, d, img, k) {
      const s = S.cal.style, W = cv.width, H = cv.height, x = cv.getContext("2d");
      const PAD = 16 * k, TOP = 22 * k, ART = (L.px - 34) * k;
      const artX = 17 * k, artY = (22 + 79 + 12 + 1) * k;
      x.globalCompositeOperation = "source-over"; x.globalAlpha = 1;
      x.clearRect(0, 0, W, H);
      x.fillStyle = s.paper; x.fillRect(0, 0, W, H);
      grainOver(x, W, H, 0.5);
      x.fillStyle = s.ink; x.strokeStyle = s.ink; x.textBaseline = "alphabetic";
      if (d.date) {
        const dt = parse(d.date);
        x.globalAlpha = d.kind === "lock" ? 0.35 : 1;
        x.font = `400 ${88 * k}px ${SANS}`; x.textAlign = "left";
        const by = TOP + 72 * k;
        if (s.numberStyle === "outline") { x.lineWidth = 2 * k; x.strokeText(String(dt.getDate()), PAD, by); } else x.fillText(String(dt.getDate()), PAD, by);
        x.globalAlpha = 1;
        x.font = `400 ${20 * k}px ${SANS}`; x.textAlign = "right";
        x.fillText(WEEK[dt.getDay()], W - PAD, TOP + 72 * k);
      }
      if (d.kind === "open") {
        roundPath(x, artX, artY, ART, ART, 10 * k);
        if (img) {
          x.save(); x.clip(); x.globalCompositeOperation = "darken"; x.drawImage(img, artX, artY, ART, ART); x.restore(); // 舊圖的純白底換成紙色
          grainOver(x, W, H, 0.25);
          roundPath(x, artX, artY, ART, ART, 10 * k);
          x.globalAlpha = 0.12; x.lineWidth = 1.5 * k; x.stroke(); x.globalAlpha = 1;
        } else {
          x.globalAlpha = 0.25; x.lineWidth = 1.5 * k; x.setLineDash([7 * k, 6 * k]); x.stroke(); x.setLineDash([]);
          x.globalAlpha = 0.72; x.textAlign = "center";
          x.font = `400 ${16 * k}px ${SANS}`; x.fillText("點紙面開始畫畫、寫字", W / 2, artY + ART / 2 + 24 * k);
          x.save(); x.translate(W / 2 - 18 * k, artY + ART / 2 - 36 * k); x.scale(1.5 * k, 1.5 * k);
          x.lineWidth = 1.5; x.lineJoin = "round"; x.lineCap = "round";
          x.stroke(new Path2D("M4 20h4L19 9l-4-4L4 16z")); x.stroke(new Path2D("M13.5 6.5l4 4"));
          x.restore(); x.globalAlpha = 1;
        }
      } else {
        x.textAlign = "center"; x.globalAlpha = 0.72; x.font = `400 ${16 * k}px ${SANS}`;
        const cy = d.date ? artY + ART / 2 : H / 2;
        d.lines.forEach((t, i) => x.fillText(t, W / 2, cy + (i - (d.lines.length - 1) / 2) * 28 * k));
        x.globalAlpha = 1;
      }
      if (d.foot) {
        x.textAlign = "right"; x.globalAlpha = 0.72; x.font = `400 ${14 * k}px ${SANS}`;
        x.fillText(d.foot, W - PAD - 24 * k, artY + ART + 28 * k); // 右邊留給翹角 x.globalAlpha = 1;
      }
    }

    async function paintSheet(sh, d) {
      const s = S.cal.style;
      const key = [d.kind, d.date, d.stamp, (d.src || "").length, d.foot, (d.lines || []).join(), s.paper, s.ink, s.numberStyle, L.px].join("|");
      if (sh.key === key) return;
      const img = d.src ? await loadImg(d.src) : null;
      await fontsFor((d.lines || []).join("") + (d.foot || "") + "星期一二三四五六日點紙面開始畫畫、寫字");
      drawSheet(sh.cv, d, img, cal.k);
      sh.tex.needsUpdate = true; sh.key = key;
      sh.back.material.color.set(s.paper).multiply(BACK_TINT);
    }

    // 板頭的底紋，跟 CSS 版的五種底紋同一組
    function boardPattern(x, W, H, k, s) {
      const c = s.accent2, tile = (w, h, fn) => {
        const t = newCanvas(Math.max(1, Math.round(w * k)), Math.max(1, Math.round(h * k))), y = t.getContext("2d");
        y.scale(t.width / w, t.height / h); fn(y);
        x.fillStyle = x.createPattern(t, "repeat"); x.fillRect(0, 0, W, H);
      };
      x.save();
      if (s.pattern === "dots") { x.globalAlpha = 0.4; tile(12, 12, (y) => { y.fillStyle = c; y.beginPath(); y.arc(6, 6, 1.55, 0, 7); y.fill(); }); }
      if (s.pattern === "grid") { x.globalAlpha = 0.28; tile(14, 14, (y) => { y.fillStyle = c; y.fillRect(0, 0, 14, 1); y.fillRect(0, 0, 1, 14); }); }
      if (s.pattern === "checks") { x.globalAlpha = 0.22; tile(16, 16, (y) => { y.fillStyle = c; y.fillRect(8, 0, 8, 8); y.fillRect(0, 8, 8, 8); }); }
      if (s.pattern === "waves") { x.globalAlpha = 0.35; tile(16, 10, (y) => { y.strokeStyle = c; y.lineWidth = 1.5; y.beginPath(); y.arc(8, 12, 7.2, 0, 7); y.stroke(); }); }
      if (s.pattern === "stripes") {
        x.globalAlpha = 0.28; x.strokeStyle = c; x.lineWidth = 4 * k;
        const step = 12 * k * Math.SQRT2;
        for (let i = -H; i < W + H; i += step) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + H, H); x.stroke(); }
      }
      x.restore();
    }

    async function paintBoard(date) {
      const s = S.cal.style, d = parse(date), goal = S.cal.goal;
      const key = [date.slice(0, 7), goal, s.accent, s.accent2, s.pattern, s.ink, L.px].join("|");
      if (cal.boardKey === key) return;
      await fontsFor(goal + MONTH_ZH[d.getMonth()]);
      const cv = cal.boardCv, W = cv.width, H = cv.height, k = W / (L.boardW * L.px), x = cv.getContext("2d");
      x.clearRect(0, 0, W, H);
      x.fillStyle = s.accent; x.fillRect(0, 0, W, H);
      boardPattern(x, W, H, k, s);
      grainOver(x, W, H, 0.4);
      x.strokeStyle = "#2A2433"; x.lineWidth = 3 * k; roundPath(x, 0, 0, W, H, 10 * k); x.stroke();
      x.fillStyle = s.ink; x.textBaseline = "alphabetic"; x.textAlign = "left";
      const ym = 12 * k + 14 * k;
      x.font = `500 ${13 * k}px ${MONO}`; x.fillText(`${d.getFullYear()}.${pad2(d.getMonth() + 1)}`, 16 * k, ym);
      x.font = `400 ${22 * k}px ${SANS}`; x.fillText(MONTH_ZH[d.getMonth()], 16 * k, ym + 29 * k);
      x.font = `400 ${14 * k}px ${SANS}`; x.textAlign = "right";
      const maxW = W * 0.56, lines = [""];
      for (const ch of goal) { const n = lines[lines.length - 1] + ch; if (x.measureText(n).width > maxW && lines.length < 2) lines.push(ch); else lines[lines.length - 1] = n; }
      lines.forEach((t, i) => x.fillText(t, W - 16 * k, ym + 29 * k - (lines.length - 1 - i) * 20 * k));
      cal.boardSide.color.set(s.accent);
      cal.boardTex.needsUpdate = true; cal.boardKey = key;
    }

    function paintStub() {
      const s = S.cal.style, key = [s.paper, s.ink, L.px].join("|");
      if (cal.stubKey === key) return;
      const cv = cal.stubCv, W = cv.width, H = cv.height, k = cal.k, x = cv.getContext("2d");
      x.fillStyle = s.paper; x.fillRect(0, 0, W, H);
      x.globalAlpha = 0.22; x.fillStyle = s.ink;
      for (let px = 10 * k; px < W - 10 * k; px += 9 * k) { x.beginPath(); x.arc(px, 11 * k, 1.5 * k, 0, 7); x.fill(); }
      x.globalAlpha = 1;
      cal.stubTex.needsUpdate = true; cal.stubKey = key;
    }

    function hintFold(sh, kind) {
      sh.fold = kind === "open" ? { cx: 0.5, cy: -L.H / 2, dx: -0.06, dy: 0.06, r: 0.024 } : null;
      deform(sh);
    }

    // 紙捲起來：把「拉起來的那一角」繞著一根圓柱翻過去，再加一點飄動的波浪
    function deform(sh) {
      const a = sh.geo.attributes.position.array, b = sh.base, f = sh.fold, w = sh.wave;
      let nx = 0, ny = 0, mx = 0, my = 0, r = 0.05, on = false;
      if (f) {
        const len = Math.hypot(f.dx, f.dy);
        if (len > 1e-4) {
          on = true; r = Math.min(f.r, len * 0.55); nx = -f.dx / len; ny = -f.dy / len;
          mx = f.cx + f.dx / 2 - (nx * Math.PI * r) / 2; my = f.cy + f.dy / 2 - (ny * Math.PI * r) / 2; // 算到紙角剛好跟著手指
        }
      }
      for (let i = 0; i < a.length; i += 3) {
        const x = b[i], y = b[i + 1];
        let ox = x, oy = y, oz = 0;
        if (on) {
          const s = (x - mx) * nx + (y - my) * ny;
          if (s > 0) {
            const along = s < Math.PI * r ? r * Math.sin(s / r) : -(s - Math.PI * r);
            oz = s < Math.PI * r ? r * (1 - Math.cos(s / r)) : 2 * r;
            ox = x + nx * (along - s); oy = y + ny * (along - s); oz += 0.002;
          }
        }
        if (w) oz += w.a * Math.sin(x * w.k + w.ph + y * 1.3);
        a[i] = ox; a[i + 1] = oy; a[i + 2] = oz;
      }
      sh.geo.attributes.position.needsUpdate = true;
      sh.geo.computeVertexNormals();
    }
    function resetSheet(sh) {
      sh.g.rotation.set(0, 0, 0); sh.g.position.set(-0.5, cal.ySheet, 0); sh.g.visible = false;
      sh.fold = null; sh.wave = null; deform(sh);
    }

    // ───── 鏡頭 ─────
    const calBox = () => {
      const top = 0.02, bottom = cal.ySheet - L.H - 0.02;
      return { cx: 0, cy: (top + bottom) / 2, z: cal.topZ, w: L.boardW + 0.06, h: top - bottom };
    };
    function poseFor(rect, box, tilt, byWidth) {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const s = byWidth ? rect.width / box.w : Math.min(rect.width / box.w, rect.height / box.h);
      const D = h / (2 * Math.tan((FOV * Math.PI) / 360) * s);
      const n = Math.hypot(tilt.x, tilt.y, 1);
      return {
        px: box.cx + (tilt.x / n) * D, py: box.cy + (tilt.y / n) * D, pz: box.z + D / n,
        lx: box.cx, ly: box.cy, lz: box.z,
        ox: w / 2 - (rect.left + rect.width / 2), oy: h / 2 - (rect.top + rect.height / 2),
      };
    }
    function restPose() {
      const r = $("#app .cal").getBoundingClientRect(), box = calBox();
      const tilt = { x: TILT.x + st.par.x, y: TILT.y + st.par.y };
      const mx = window.innerWidth < 900 ? r.width * 0.05 : 0;
      const slot = { left: r.left + mx, top: r.top + 2, width: r.width - mx * 2, height: r.height - 6 };
      let rect = { ...slot }, p = poseFor(rect, box, tilt);
      const w = canvas.clientWidth, h = canvas.clientHeight, v = new THREE.Vector3();
      for (let i = 0; i < 3; i++) {
        setCam(p);
        let l = 1e9, t = 1e9, rr = -1e9, b = -1e9;
        for (const [x, y, z] of [[-box.w / 2, box.cy + box.h / 2, cal.topZ], [box.w / 2, box.cy + box.h / 2, cal.topZ], [-box.w / 2, box.cy - box.h / 2, cal.topZ], [box.w / 2, box.cy - box.h / 2, cal.topZ], [box.w / 2, box.cy - box.h / 2, STACK_Z], [box.w / 2 + 0.05, box.cy - box.h / 2 - 0.03, 0]]) {
          v.set(x, y, z).project(camera);
          const sx = (v.x + 1) / 2 * w, sy = (1 - v.y) / 2 * h;
          l = Math.min(l, sx); rr = Math.max(rr, sx); t = Math.min(t, sy); b = Math.max(b, sy);
        }
        const k = Math.min(slot.width / (rr - l), slot.height / (b - t));
        const cw = rect.width * k, ch = rect.height * k;
        const dx = slot.left + slot.width / 2 - (l + rr) / 2, dy = slot.top + slot.height / 2 - (t + b) / 2;
        rect = { left: rect.left + dx + (rect.width - cw) / 2, top: rect.top + dy + (rect.height - ch) / 2, width: cw, height: ch };
        p = poseFor(rect, box, tilt);
      }
      return p;
    }
    const sheetBox = () => ({ cx: 0, cy: cal.ySheet - L.H / 2, z: cal.topZ, w: 1, h: L.H });
    function setCam(p) {
      st.cam = p;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      camera.aspect = w / h;
      camera.position.set(p.px, p.py, p.pz);
      camera.lookAt(p.lx, p.ly, p.lz);
      camera.setViewOffset(w, h, p.ox, p.oy, w, h);
      camera.updateMatrixWorld();
    }
    const mixPose = (a, b, t) => Object.fromEntries(Object.keys(a).map((k) => [k, lerp(a[k], b[k], t)]));

    function layout() {
      renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
      const n = measure();
      if (!st.busy && !st.intro && !sameL(L, n)) { L = n; buildCal(); }
    }

    function onResize() {
      clearTimeout(onResize.t);
      onResize.t = setTimeout(async () => {
        if (!st.on || st.mode !== "rest") { if (st.on) renderer.setSize(canvas.clientWidth, canvas.clientHeight, false); return; }
        layout(); await sync(); setCam(restPose()); kick();
      }, 120);
    }

    // ───── 跟資料同步：全部排隊，不會兩次一起畫同一張 ─────
    function sync() { st.queue = st.queue.then(doSync).catch(() => {}); return st.queue; }
    async function doSync() {
      if (!cal || !S.cal) return;
      const cur = currentPage(), s = stats(), kind = cur.kind;
      const under = kind === "done" ? 0 : Math.max(0, S.cal.len - s.torn - 1);
      await paintBoard(cur.date || todayStr());
      paintStub();
      const d = describe(cur);
      await paintSheet(st.top, d);
      if (kind === "open") await paintSheet(st.under, describe(pageAfter(cur.date)));
      for (const m of cal.stackMats) if (m.map == null) m.color.set(S.cal.style.paper);
      if (!st.intro) {
        setDepth(kind === "done" ? 0 : depthFor(under));
        st.top.g.visible = true;
        if (st.under) st.under.g.visible = kind === "open" && !st.busy ? true : st.under.g.visible;
        if (!st.drag && !st.busy) hintFold(st.top, d.kind);
      }
      const hint = $(".t3-hint");
      if (hint) hint.textContent = d.src ? "也可以抓著紙角拖下來" : "畫完才能撕";
      kick();
    }

    function afterRender() {
      if (!st.ready || st.failed) return;
      if (S.view !== "today") {
        st.on = false; st.mode = "rest"; st.drag = null;
        root.classList.remove("t3", "t3-rest", "t3-fly", "t3-draw");
        return;
      }
      root.classList.add("t3");
      st.on = true;
      if (st.mode !== "rest") {
        if (!$("#live")) { st.mode = "rest"; root.classList.remove("t3-fly", "t3-draw"); }
        else return;
      }
      root.classList.add("t3-rest");
      layout();
      setCam(restPose());
      if (!st.shown) { st.shown = true; start(); } else { sync(); kick(); }
    }

    async function start() {
      cal.pivot.visible = false;
      await sync();
      root.classList.remove("t3-wait");
      cal.pivot.visible = true;
      if (!reduceMotion() && query.get("intro") !== "0") await playIntro();
      else kick();
      sync();
    }

    // ───── 開場：紛飛的日曆頁聚攏成冊，裝訂條扣上，掛繩晃一下 ─────
    function introTextures() {
      const out = [], w = 256, h = Math.round(w * L.H), k = w / L.px, s = S.cal.style;
      const base = parse(S.cal.start);
      for (let i = 0; i < 4; i++) {
        const c = newCanvas(w, h), x = c.getContext("2d");
        x.fillStyle = s.paper; x.fillRect(0, 0, w, h); grainOver(x, w, h, 0.5);
        x.fillStyle = s.ink; x.font = `400 ${88 * k}px ${SANS}`; x.textBaseline = "alphabetic";
        const d = new Date(base); d.setDate(d.getDate() + 3 + i * 5);
        x.fillText(String(d.getDate()), 16 * k, 94 * k);
        x.globalAlpha = 0.25; x.lineWidth = 1.5 * k; x.setLineDash([7 * k, 6 * k]);
        roundPath(x, 17 * k, 114 * k, (L.px - 34) * k, (L.px - 34) * k, 10 * k); x.stroke();
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; out.push(t);
      }
      return out;
    }

    function playIntro() {
      return new Promise((done) => {
        st.intro = true; st.skip = false; st.frames = []; st.sun.shadow.intensity = SHADOW_AIR;
        const box = sheetBox(), D = Math.hypot(st.cam.px - st.cam.lx, st.cam.py - st.cam.ly, st.cam.pz - st.cam.lz);
        const vis = 2 * D * Math.tan((FOV * Math.PI) / 360);
        const depth = depthFor(S.cal.len - stats().torn - 1);
        setDepth(depth, true);
        const n = window.innerWidth < 600 ? 12 : 18;
        const texs = introTextures();
        const group = new THREE.Group();
        const rnd = (a) => (Math.random() - 0.5) * a;
        const items = [];
        for (let i = 0; i < n; i++) {
          const geo = new THREE.PlaneGeometry(1, L.H, 6, 8);
          const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: texs[i % texs.length], side: THREE.DoubleSide, shadowSide: THREE.DoubleSide }));
          m.castShadow = true; m.visible = false; group.add(m);
          items.push({
            m, geo, base: geo.attributes.position.array.slice(), delay: 0.04 + (i * 1.1) / n, dur: 0.82 + Math.random() * 0.12,
            sx: rnd(vis * 0.9), sy: box.cy + vis * (0.62 + Math.random() * 0.4), sz: 0.3 + Math.random() * 1.1,
            rx: rnd(1.8), ry: rnd(2.2), rz: rnd(2.6), ph: Math.random() * 6, tz: STACK_Z + (depth * (i + 1)) / n,
          });
        }
        cal.pivot.add(group);
        const top = st.top, under = st.under;
        top.g.visible = false; under.g.visible = false; cal.stub.visible = false;
        cal.stack.scale.z = 0.02;
        const finish = () => {
          group.traverse((o) => { o.geometry?.dispose(); o.material?.dispose(); });
          cal.pivot.remove(group); texs.forEach((t) => t.dispose());
          cal.pivot.rotation.z = 0; cal.top.position.y = 0; cal.stack.scale.z = 1; cal.stub.visible = true;
          top.g.rotation.set(0, 0, 0); top.g.position.set(-0.5, cal.ySheet, cal.topZ); top.g.visible = true; top.wave = null;
          under.g.visible = true; hintFold(top, describe(currentPage()).kind);
          st.sun.shadow.intensity = SHADOW; st.intro = false; kick(); done();
        };
        let t = 0;
        const a = (dt) => {
          t += dt / 1000;
          if (!cal || st.failed) { st.intro = false; done(); return false; }
          if (st.skip || t >= INTRO_S) { finish(); return false; }
          st.sun.shadow.intensity = lerp(SHADOW_AIR, SHADOW, clamp((t - 1.5) / 0.6));
          let landed = 0;
          for (const it of items) {
            const u = clamp((t - it.delay) / it.dur);
            if (u <= 0) continue;
            if (u >= 1) { it.m.visible = false; landed++; continue; }
            const e = easeInOut(u), o = 1 - e;
            it.m.visible = true;
            it.m.position.set(lerp(it.sx, 0, e) + Math.sin(u * 7 + it.ph) * 0.26 * o, lerp(it.sy, box.cy, e), lerp(it.sz, it.tz, e));
            it.m.rotation.set(it.rx * o + Math.sin(u * 6 + it.ph) * 0.25 * o, it.ry * o, it.rz * o);
            const p = it.geo.attributes.position, A = 0.09 * o;
            for (let i = 0; i < p.array.length; i += 3) p.array[i + 2] = A * Math.sin(it.base[i] * 4 + it.base[i + 1] * 1.3 + it.ph + u * 8);
            p.needsUpdate = true; it.geo.computeVertexNormals();
          }
          cal.stack.scale.z = Math.max(0.02, landed / n);
          // 最上面那頁最後到
          const u = clamp((t - 1.12) / 0.74);
          if (u > 0) {
            const e = easeInOut(u), o = 1 - e;
            top.g.visible = true;
            top.g.position.set(-0.5 + Math.sin(u * 6) * 0.14 * o, cal.ySheet + vis * 0.8 * o, lerp(0.9, cal.topZ, e));
            top.g.rotation.set(0.5 * o, -0.4 * o, 0.5 * o);
            top.wave = { a: 0.05 * o, k: 4, ph: u * 8 }; top.fold = null; deform(top);
          }
          // 裝訂條扣上
          const b = clamp((t - 1.32) / 0.5);
          cal.top.position.y = b < 1 ? (1 - easeBack(b)) * vis * 0.55 + (b <= 0 ? vis : 0) : 0;
          if (b >= 1) cal.stub.visible = true;
          // 掛繩晃一下停住
          const w = t - 1.86;
          cal.pivot.rotation.z = w > 0 ? 0.034 * Math.exp(-3.6 * w) * Math.sin(10.5 * w) : 0;
          return true;
        };
        anims.add(a); kick();
      });
    }

    // ───── 手指和滑鼠 ─────
    const ray = () => { pickRay.r = pickRay.r || new THREE.Raycaster(); return pickRay.r; };
    function pickRay(e) {
      const r = canvas.getBoundingClientRect();
      const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray().setFromCamera(v, camera);
      const o = ray().ray.origin, d = ray().ray.direction, t = (cal.topZ - o.z) / d.z;
      return { x: o.x + d.x * t, y: o.y + d.y * t - (cal.ySheet - L.H / 2) };
    }
    const onPage = (p) => Math.abs(p.x) <= 0.5 && Math.abs(p.y) <= L.H / 2;
    const uiTarget = (e) => e.target.closest?.("button, a, input, label, .modal");

    function onDown(e) {
      if (st.intro) { st.skip = true; return; }
      if (!st.on || st.mode !== "rest" || st.busy || !cal || uiTarget(e) || document.querySelector(".modal")) return;
      if (e.button) return;
      const p = pickRay(e);
      if (!onPage(p)) return;
      const cur = currentPage();
      if (cur.kind !== "open") return;
      const cx = p.x >= 0 ? 0.5 : -0.5, cy = p.y >= 0 ? L.H / 2 : -L.H / 2;
      st.drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, p0: p, cx, cy, moved: false, armed: false, date: cur.date, art: hasArt(S.days[dayKey(cur.date)]) };
    }

    function onMove(e) {
      const d = st.drag;
      if (!d) { hover(e); return; }
      if (e.pointerId !== d.id) return;
      if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 9) return;
      if (!d.moved) { d.moved = true; root.classList.add("t3-grab"); }
      const p = pickRay(e);
      let dx = p.x - d.p0.x, dy = p.y - d.p0.y;
      // 往紙外面拉也算把角掀起來
      const ix = -Math.sign(d.cx), iy = -Math.sign(d.cy);
      if (dx * ix < 0) dx = -dx;
      if (dy * iy < 0) dy = -dy;
      let len = Math.hypot(dx, dy);
      const max = d.art ? 1.05 : 0.3;
      if (len > max) { dx *= max / len; dy *= max / len; len = max; }
      if (len < 0.001) { dx = ix * 0.001; dy = iy * 0.001; }
      st.top.fold = { cx: d.cx, cy: d.cy, dx, dy, r: 0.03 + 0.05 * clamp(len / ARM) };
      deform(st.top); kick();
      const armed = d.art && len >= ARM;
      if (armed !== d.armed) { d.armed = armed; setMsg(armed ? "放開就撕下來" : ""); }
    }

    function onUp(e) {
      const d = st.drag;
      if (!d || e.pointerId !== d.id) return;
      st.drag = null; root.classList.remove("t3-grab");
      if (!d.moved) { enterDraw(); return; }
      if (d.armed) { st.dragTear = true; tear(d.date); return; }
      if (!d.art) setMsg("先畫點東西再撕", true); else setMsg("");
      springBack();
    }
    function onCancel(e) {
      const d = st.drag;
      if (!d || e.pointerId !== d.id) return;
      st.drag = null; root.classList.remove("t3-grab");
      if (d.moved) springBack();
    }

    // 滑鼠移到紙上：游標提示，鏡頭跟著微微轉一點
    function hover(e) {
      if (!st.on || st.mode !== "rest" || e.pointerType !== "mouse" || !cal || st.intro) return;
      const can = !st.busy && !uiTarget(e) && !document.querySelector(".modal") && currentPage().kind === "open";
      root.classList.toggle("t3-hot", can && onPage(pickRay(e)));
      st.par.tx = (e.clientX / window.innerWidth - 0.5) * -0.07;
      st.par.ty = (e.clientY / window.innerHeight - 0.5) * 0.05;
      if (st.par.run || reduceMotion()) return;
      st.par.run = true;
      anims.add(() => {
        const q = st.par;
        q.x += (q.tx - q.x) * 0.08; q.y += (q.ty - q.y) * 0.08;
        if (st.on && st.mode === "rest" && !st.intro) setCam(restPose());
        if (Math.abs(q.tx - q.x) + Math.abs(q.ty - q.y) < 0.0006) { q.run = false; return false; }
      });
      kick();
    }

    // 拖到一半放開：紙彈回去
    function springBack() {
      const sh = st.top, f = sh.fold;
      if (!f) return Promise.resolve();
      if (reduceMotion()) { hintFold(sh, describe(currentPage()).kind); kick(); return Promise.resolve(); }
      const dx = f.dx, dy = f.dy, r = f.r;
      st.busy = true;
      Sound.flip();
      return anim(620, (p) => {
        const t = p * 0.62, m = Math.exp(-6.5 * t) * Math.abs(Math.cos(13 * t)) * (1 - p * p);
        sh.fold = { cx: f.cx, cy: f.cy, dx: dx * m, dy: dy * m, r: Math.max(0.02, r * (0.5 + m)) };
        deform(sh);
        cal.pivot.rotation.z = 0.006 * Math.exp(-5 * t) * Math.sin(16 * t);
      }).then(() => { cal.pivot.rotation.z = 0; st.busy = false; hintFold(sh, describe(currentPage()).kind); kick(); });
    }

    // ───── 撕下來：沿撕線裂開，繞著左上角轉開，捲著飄出右下 ─────
    function startTear() {
      const sh = st.top, dragged = st.dragTear;
      st.dragTear = false; st.busy = true;
      st.top = st.under; st.under = st.spare; st.spare = null;
      st.top.g.visible = true; st.top.fold = null; deform(st.top);
      placeSheets();
      const release = () => { st.sun.shadow.intensity = SHADOW; resetSheet(sh); st.spare = sh; st.busy = false; sync(); };
      if (reduceMotion()) { release(); return; }
      sh.g.position.z = cal.topZ + 0.003;
      const f0 = dragged && sh.fold ? sh.fold : { cx: 0.5, cy: L.H / 2, dx: 0, dy: 0, r: 0.08 };
      const dx1 = -0.3, dy1 = f0.cy > 0 ? -0.24 : 0.24;
      const D = Math.hypot(st.cam.px - st.cam.lx, st.cam.py - st.cam.ly, st.cam.pz - st.cam.lz);
      const fall = 2 * D * Math.tan((FOV * Math.PI) / 360) * 1.05 + L.H;
      const RIP = 0.3, y0 = sh.g.position.y, z0 = sh.g.position.z, DEG = Math.PI / 180;
      anim(TEAR_MS, (p) => {
        const e = easeOut(clamp(p / 0.5));
        sh.fold = { cx: f0.cx, cy: f0.cy, dx: lerp(f0.dx, f0.cx > 0 ? dx1 : -dx1, e), dy: lerp(f0.dy, dy1, e), r: lerp(f0.r, 0.11, clamp(p / 0.6)) };
        if (p < RIP) {
          const u = p / RIP;
          sh.g.rotation.z = -6 * DEG * u * u;
          sh.g.position.x = -0.5 + 0.09 * u * u;
          sh.g.position.y = y0 - 0.03 * u * u;
        } else {
          const u = (p - RIP) / (1 - RIP);
          sh.g.rotation.z = -(6 + 22 * u) * DEG;
          // 紙一律往鏡頭這邊翻，不會插進下一頁
          sh.g.rotation.x = -0.5 * Math.sin(u * 2.9) - 0.14 * u;
          sh.g.rotation.y = -0.34 * Math.sin(u * 3.1 + 0.3);
          sh.g.position.x = -0.41 + 1.9 * Math.pow(u, 1.35) + 0.05 * Math.sin(u * 7); // 明顯往右下飄出去
          sh.g.position.y = y0 - 0.03 - fall * u * u;
          sh.g.position.z = z0 + 0.04 + 0.7 * u;
          sh.wave = { a: 0.045 * Math.sin(u * 3.14), k: 5, ph: u * 11 };
          st.sun.shadow.intensity = lerp(SHADOW, SHADOW_AIR, clamp(u * 3));
        }
        deform(sh);
      }).then(release);
    }

    // ───── 畫圖：鏡頭拉正，3D 的紙換成平面的畫布 ─────
    function enterDraw() {
      if (!st.on || st.mode !== "rest" || st.busy || st.intro || !$("#live")) return;
      setMsg("");
      if (reduceMotion()) { root.classList.remove("t3-rest"); root.classList.add("t3-draw"); st.mode = "draw"; return; }
      const from = st.cam;
      root.classList.remove("t3-rest", "t3-hot"); root.classList.add("t3-fly");
      window.scrollTo(0, 0);
      st.mode = "fly";
      const to = poseFor($("#top-sheet").getBoundingClientRect(), sheetBox(), { x: 0, y: 0 }, true);
      const f = st.top.fold;
      anim(CAM_MS, (p) => {
        const e = easeInOut(p);
        setCam(mixPose(from, to, e));
        if (f) { st.top.fold = { ...f, dx: f.dx * (1 - e), dy: f.dy * (1 - e) }; deform(st.top); }
      }).then(() => {
        if (st.mode !== "fly") return;
        st.mode = "draw";
        root.classList.remove("t3-fly"); root.classList.add("t3-draw");
      });
    }

    async function exitDraw() {
      if (st.mode !== "draw") return;
      const date = currentPage().date;
      if (date) await flushSave(date);
      setMsg("");
      window.scrollTo(0, 0);
      const el = $("#top-sheet");
      const from = el ? poseFor(el.getBoundingClientRect(), sheetBox(), { x: 0, y: 0 }, true) : st.cam;
      st.mode = "fly";
      await sync();
      root.classList.remove("t3-draw"); root.classList.add("t3-fly");
      setCam(from); st.top.fold = null; deform(st.top); kick();
      root.classList.remove("t3-fly"); root.classList.add("t3-rest");
      const to = restPose();
      if (reduceMotion()) setCam(to);
      else await anim(CAM_MS, (p) => setCam(mixPose(from, to, easeInOut(p))));
      st.mode = "rest";
      hintFold(st.top, describe(currentPage()).kind); kick();
    }

    return {
      init, afterRender, enterDraw, exitDraw, startTear, springBack,
      active: () => st.on && !st.failed,
      drawing: () => st.on && st.mode === "draw",
      busy: () => st.on && (st.busy || st.intro || st.mode === "fly"),
    };
  })();

  // ───────── 開機：一進來就是今天那頁 ─────────
  async function boot() {
    Garden.init();
    T3.init();
    const use = (n) => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
    S.store = await makeStore();
    try {
      const all = await S.store.all();
      if (all.cal) { S.cal = all.cal; S.calSaved = true; }
      for (const [k, v] of Object.entries(all)) if (k.startsWith("d-")) S.days[k] = v;
    } catch {}
    if (!S.cal) S.cal = defaultCal();
    S.cal.style = normalizeStyle(S.cal.style);
    render();
    const [sample, downloads] = await Promise.all([use("sample"), use("downloads")]);
    S.downloads = downloads || webDownloads; S.sample = sample;
    if (sample) { const caps = await sample.limits().catch(() => null); S.aiImages = !!caps?.images; }
    // 下載鈕要等能力回來才出現；今天那頁沒在畫的時候才重畫，免得洗掉畫到一半的東西
    if (downloads && S.view === "today" && !saveTimer && !(S.live && S.live.dirty)) {
      const cur = currentPage();
      const bar = $(".actions");
      if (cur.kind === "open" && bar && !$('[data-act="save"]')) {
        const art = hasArt(S.days[dayKey(cur.date)]);
        bar.insertAdjacentHTML("beforeend", `<button type="button" class="btn" data-act="save" data-date="${cur.date}" ${art ? "" : "disabled"}>存成圖片</button>`);
        $('[data-act="save"]').addEventListener("click", async () => { await flushSave(cur.date); savePageImage(cur.date); });
      }
    }
  }
  // 月曆用鍵盤左右鍵翻頁
  document.addEventListener("keydown", (e) => {
    if (S.view !== "month" || document.querySelector(".modal") || e.target.closest?.("input, textarea")) return;
    if (e.key === "ArrowRight") flipMonth(1);
    if (e.key === "ArrowLeft") flipMonth(-1);
  });
  boot();
})();
</script>
