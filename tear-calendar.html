<style>
/* 版面：工具頁，霧白底＋白卡片；手機一欄最寬 480px，桌機 900px 以上日曆在左、工具在右 */
/* 主角是一本掛在牆上的撕日曆：釘子和掛繩、上方裝訂條、一疊對齊的頁（下緣看得到厚度）、撕過留下的紙邊 */
/* 只用亮色主題，刻意不做深色版 */
:root {
  --c-lime: #D3E5D7;      --c-lime-soft: #FFFFCD;      --c-lime-deep: #4C7A5F;
  --c-rose: #F2E9EC;      --c-rose-soft: #F8F3F5;      --c-rose-deep: #A0566F;
  --c-lavender: #FFFFCD;  --c-lavender-soft: #FFFFE6;  --c-lavender-deep: #7D7A2E;
  --c-bg: #FFFDF6;  --c-surface: #FFFEFA;  --c-line: #E4E5D6;  --c-wall: #FAF8EF;
  --c-text: #2A2433;  --c-text-2: #6E6878;  --c-text-3: #9C96A6;
  --c-overlay: rgba(42, 36, 51, 0.5);
  --radius-sm: 10px;  --radius-md: 16px;  --radius-pill: 999px;
  --shadow: 0 8px 24px rgba(42, 36, 51, 0.08);
  --font-sans: "Huninn", "jf-openhuninn-2.1", "PingFang TC", "Noto Sans TC", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --fs-h1: 32px;  --fs-h2: 22px;  --fs-h3: 18px;
  --fs-body: 16px;  --fs-sm: 14px;  --fs-tag: 13px;  --fs-caption: 12px;
  --lh-title: 1.35;  --lh-h2: 1.4;  --lh-h3: 1.5;
  --lh-body: 1.75;  --lh-sm: 1.7;  --lh-ui: 1.4;  --lh-single: 1;
  color-scheme: light;
}
@media (max-width: 480px) {
  :root { --fs-h1: 28px; --fs-h2: 20px; }
}
* { box-sizing: border-box; }
html, body { min-height: 100%; overflow-x: clip; }
body {
  font-family: var(--font-sans);
  font-weight: 400;
  font-synthesis: none;
  color: var(--c-text);
  background: var(--c-wall);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  letter-spacing: normal;
  line-break: strict;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; line-height: var(--lh-single); }
:focus-visible { outline: 1.5px solid var(--c-text); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-weight: 500; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }

.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ─── 頁首 ─── */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: var(--fs-tag); line-height: var(--lh-ui); color: var(--c-text-2); }
h1 { margin: 0; font-size: var(--fs-h1); font-weight: 400; line-height: var(--lh-title); text-wrap: balance; }
h2 { margin: 0; font-size: var(--fs-h2); font-weight: 400; line-height: var(--lh-h2); text-wrap: balance; }
.hint { margin: 0; font-size: var(--fs-sm); color: var(--c-text-2); line-height: var(--lh-sm); text-wrap: pretty; }

/* 分段切換 */
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--c-line); border-radius: var(--radius-pill); background: var(--c-surface); }
.seg button { height: 32px; padding: 0 14px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--c-text-2); font-size: var(--fs-sm); }
.seg button[aria-pressed="true"] { background: var(--c-text); color: #FFFFFF; }

/* ─── 卡片、欄位 ─── */
.card { background: var(--c-bg); border: 1px solid var(--c-line); border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; flex-direction: column; gap: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .label { font-size: var(--fs-sm); line-height: var(--lh-ui); color: var(--c-text-2); }
.input { height: 44px; border: 1px solid var(--c-line); border-radius: var(--radius-sm); background: var(--c-bg); padding: 0 12px; font-size: var(--fs-body); width: 100%; min-width: 0; }
.input::placeholder { color: var(--c-text-3); }
.input:focus { outline: none; border: 1.5px solid var(--c-text); padding: 0 11.5px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.choice { height: 36px; border: 1px solid var(--c-line); border-radius: var(--radius-sm); background: var(--c-bg); font-size: 14px; }
.choice[aria-pressed="true"] { background: var(--c-lime-soft); border-color: var(--c-text); color: var(--c-text); }

/* 照片格 */
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photo {
  position: relative; aspect-ratio: 1; max-width: 100%;
  border: 1.5px dashed var(--c-line); border-radius: var(--radius-sm);
  background: var(--c-surface); overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--c-text-2); font-size: var(--fs-sm);
}
.photo:hover { border-color: var(--c-text-3); }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo.filled { border-style: solid; }
.photo .num { font-size: var(--fs-tag); color: var(--c-text-2); }
.photo svg { width: 24px; height: 24px; }

/* ─── 按鈕 ─── */
.btn { height: 44px; padding: 0 20px; border-radius: var(--radius-sm); border: 1px solid var(--c-text); background: var(--c-bg); color: var(--c-text); font-size: var(--fs-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn.primary { background: var(--c-lime); border-color: #8DB99C; }
.btn.primary:hover { background: radial-gradient(80% 120% at 50% 50%, var(--c-lime-soft) 0%, var(--c-lime) 70%); }
.btn:disabled { background: var(--c-surface); border-color: var(--c-line); color: var(--c-text-3); cursor: not-allowed; }
.btn.block { width: 100%; }
.pill { height: 32px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--c-line); background: var(--c-bg); color: var(--c-text-2); font-size: var(--fs-sm); }
.pill:hover { color: var(--c-text); border-color: var(--c-text-3); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 auto; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 24px; padding: 0 10px; border-radius: var(--radius-pill); font-size: var(--fs-tag); display: inline-flex; align-items: center; background: var(--c-surface); color: var(--c-text-2); }
.chip.lime { background: var(--c-lime-soft); color: var(--c-lime-deep); }
.chip.rose { background: var(--c-rose-soft); color: var(--c-rose-deep); }
.chip.lav { background: var(--c-lavender-soft); color: var(--c-lavender-deep); }

.status { font-size: var(--fs-sm); line-height: var(--lh-ui); color: var(--c-text-2); min-height: 1.4em; }
.status.err { color: var(--c-rose-deep); }

/* ─── 撕日曆本體 ─── */
.cal {
  --p-paper: #FFFDF6; --p-ink: #2A2433; --p-accent: #D3E5D7; --p-accent2: #8DB99C;
  display: flex; flex-direction: column; align-items: stretch;
}
/* 釘子和掛繩 */
.cal { position: relative; }
.nail { position: absolute; z-index: 4; top: 0; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--c-line); border: 1.5px solid var(--c-text); }
.cal.mini .nail { display: none; }
.hanger { display: block; width: 52%; height: 36px; margin: 0 auto -1px; overflow: visible; color: var(--c-text); }
.board {
  position: relative; z-index: 3;
  background: var(--p-accent); color: var(--p-ink);
  border: 1.5px solid var(--c-text); border-radius: var(--radius-sm) var(--radius-sm) 4px 4px;
  padding: 12px 16px 24px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  box-shadow: 0 6px 14px rgba(42, 36, 51, 0.10);
}
/* 裝訂條上的訂書針 */
.board .staples { position: absolute; left: 20px; right: 20px; bottom: 7px; display: flex; justify-content: space-between; pointer-events: none; }
.board .staples i { width: 16px; height: 4px; border-radius: 2px; background: var(--c-text-3); }
.board .ym { font-size: var(--fs-tag); line-height: var(--lh-ui); }
.board .month { font-size: 22px; line-height: var(--lh-h2); }
.board .goal { font-size: var(--fs-sm); text-align: right; max-width: 60%; line-height: var(--lh-ui); overflow-wrap: break-word; text-wrap: balance; }

/* 底紋 */
.pat-dots { background-image: radial-gradient(color-mix(in srgb, var(--p-accent2) 40%, transparent) 1.5px, transparent 1.6px); background-size: 12px 12px; }
.pat-stripes { background-image: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--p-accent2) 28%, transparent) 0 4px, transparent 4px 12px); }
.pat-grid { background-image: linear-gradient(color-mix(in srgb, var(--p-accent2) 28%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--p-accent2) 28%, transparent) 1px, transparent 1px); background-size: 14px 14px; }
.pat-waves { background-image: radial-gradient(circle at 50% 120%, transparent 6px, color-mix(in srgb, var(--p-accent2) 35%, transparent) 6.5px 8px, transparent 8.5px); background-size: 16px 10px; }
.pat-checks { background-image: conic-gradient(color-mix(in srgb, var(--p-accent2) 22%, transparent) 25%, transparent 0 50%, color-mix(in srgb, var(--p-accent2) 22%, transparent) 0 75%, transparent 0); background-size: 16px 16px; }

/* 一疊頁：每頁對齊疊在一起，下緣露出紙的厚度 */
.pad { position: relative; margin: -1px 3px 0; }
/* 撕過的頁留在裝訂條下的紙邊 */
.stubs { position: absolute; z-index: 2; top: 0; left: 0; right: 0; height: 6px; background: var(--p-paper); border: 1px solid var(--c-line); border-width: 0 1px; pointer-events: none; }
.stubs::after {
  content: ""; position: absolute; left: -1px; right: -1px; top: 100%; height: 4px;
  background: linear-gradient(135deg, var(--p-paper) 50%, transparent 50%) 0 0 / 7px 7px,
              linear-gradient(225deg, var(--p-paper) 50%, transparent 50%) 0 0 / 7px 7px;
  filter: drop-shadow(0 1px 0 var(--c-line));
}
.edges {
  height: var(--thick, 8px); margin: 0 1px;
  background: repeating-linear-gradient(to bottom, var(--p-paper) 0 2px, var(--c-line) 2px 3px);
  border: 1px solid var(--c-line); border-top: 0; border-radius: 0 0 4px 4px;
  box-shadow: 0 10px 18px rgba(42, 36, 51, 0.08);
}
.pad.zigzag .edges { position: relative; border-radius: 0; margin-bottom: 7px; }
.pad.zigzag .edges::after {
  content: ""; position: absolute; left: -1px; right: -1px; bottom: -7px; height: 7px;
  background: linear-gradient(135deg, var(--p-paper) 50%, transparent 50%) 0 0 / 10px 10px,
              linear-gradient(225deg, var(--p-paper) 50%, transparent 50%) 0 0 / 10px 10px;
}

.sheet {
  position: relative; z-index: 1;
  background: var(--p-paper); color: var(--p-ink);
  border: 1px solid var(--c-line); border-radius: 2px 2px 0 0;
  padding: 22px 16px 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.pad.empty .sheet { border-radius: 2px 2px var(--radius-sm) var(--radius-sm); }
/* 撕線：頂端一排小孔 */
.sheet::before {
  content: ""; position: absolute; top: 9px; left: 10px; right: 10px; height: 4px;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--p-ink) 22%, transparent) 1.5px, transparent 1.8px);
  background-size: 9px 4px;
}
/* 右下角微微翹起，看得到下一頁 */
.sheet.curl::after {
  content: ""; position: absolute; right: -1px; bottom: -1px; width: 26px; height: 26px;
  background: linear-gradient(to top left, var(--c-surface) 0 50%, var(--c-line) 50%, var(--c-surface) 64%, var(--p-paper) 100%);
  box-shadow: -1px -1px 3px rgba(42, 36, 51, 0.06);
  pointer-events: none;
}
.sheet.curl .sheet-foot { padding-right: 24px; }
.sheet-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.daynum { font-size: 88px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.daynum.outline { color: transparent; -webkit-text-stroke: 2px var(--p-ink); }
.dayside { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
.weekday { font-size: 20px; line-height: var(--lh-h2); }
.pageno { font-size: var(--fs-tag); line-height: var(--lh-ui); color: color-mix(in srgb, var(--p-ink) 72%, var(--p-paper)); }
.art {
  position: relative; aspect-ratio: 1; width: 100%; max-width: 100%;
  border-radius: var(--radius-sm); overflow: hidden;
  border: 1.5px dashed color-mix(in srgb, var(--p-ink) 25%, transparent);
  background: transparent;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
  color: color-mix(in srgb, var(--p-ink) 72%, var(--p-paper)); font-size: var(--fs-body);
}
.art.has { border-style: solid; border-color: color-mix(in srgb, var(--p-ink) 12%, transparent); }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
button.art:hover { border-color: var(--p-ink); color: var(--p-ink); }
.art svg { width: 36px; height: 36px; }
.art svg.doodle { width: 78%; height: 78%; }
.sheet-foot { display: flex; justify-content: flex-end; min-height: 1.4em; align-items: baseline; gap: 8px; font-size: var(--fs-sm); line-height: var(--lh-ui); color: color-mix(in srgb, var(--p-ink) 72%, var(--p-paper)); }
.sheet-foot .mono { font-size: var(--fs-tag); }
.sheet.locked .daynum { opacity: 0.35; }
.lockmsg { padding: 32px 8px; text-align: center; font-size: var(--fs-body); line-height: var(--lh-body); color: color-mix(in srgb, var(--p-ink) 72%, var(--p-paper)); }

/* 撕下來的那頁：從右上角先裂開，往右下掉出畫面 */
.ghost {
  position: fixed; z-index: 40; margin: 0; pointer-events: none;
  transform-origin: 0 0; will-change: transform, opacity;
  box-shadow: 0 14px 28px rgba(42, 36, 51, 0.16);
  animation: rip 0.85s cubic-bezier(.45, 0, .7, .3) forwards;
}
@keyframes rip {
  0% { transform: none; }
  22% { transform: rotate(4deg) translate(2px, 4px); }
  40% { transform: rotate(9deg) translate(6px, 10px); }
  100% { transform: rotate(30deg) translate(60px, 110vh); opacity: 0.6; }
}
@media (prefers-reduced-motion: reduce) {
  .ghost { animation: fade 0.25s forwards; }
  @keyframes fade { to { opacity: 0; } }
}

/* ─── 月曆 ─── */
.mgrid { border: 1px solid var(--c-line); border-radius: var(--radius-md); overflow: hidden; display: grid; grid-template-columns: repeat(7, 1fr); background: var(--c-line); gap: 1px; }
.mgrid .wd { background: var(--c-surface); font-size: var(--fs-sm); line-height: var(--lh-ui); color: var(--c-text-2); text-align: center; padding: 4px 0; }
.mcell { position: relative; aspect-ratio: 1; min-width: 0; background: var(--c-bg); border: 0; padding: 0; font-size: var(--fs-tag); line-height: var(--lh-ui); color: var(--c-text); display: flex; align-items: flex-start; justify-content: flex-start; overflow: hidden; }
.mcell span { position: relative; z-index: 1; padding: 2px 5px; font-family: var(--font-mono); font-weight: 500; }
.mcell.has span { background: rgba(255,255,255,0.85); border-bottom-right-radius: 6px; }
.mcell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mcell.out { background: var(--c-surface); cursor: default; }
.mcell.out span { visibility: hidden; }
.mcell.future { color: var(--c-text-3); cursor: default; }
.mcell.today { box-shadow: inset 0 0 0 1.5px var(--c-text); }
.mcell.miss::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--c-rose-deep); }
.mcell.kept::after { content: ""; position: absolute; right: 5px; bottom: 5px; width: 10px; height: 5px; border-left: 1.5px solid var(--c-text); border-bottom: 1.5px solid var(--c-text); transform: rotate(-45deg); background: none; }
button.mcell:not(.out):not(.future):hover { box-shadow: inset 0 0 0 1.5px var(--c-text-3); }
.legend { display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: var(--fs-sm); line-height: var(--lh-ui); color: var(--c-text-2); }

/* 月曆也是掛在牆上的一本，一個月一頁，往上翻 */
.mstage { display: flex; flex-direction: column; gap: 16px; }
.mpages { position: relative; margin: -1px 3px 0; perspective: 1600px; touch-action: pan-y; }
.mpage {
  position: relative; z-index: 1;
  background: var(--p-paper); border: 1px solid var(--c-line); border-radius: 2px 2px 0 0;
  padding: 22px 12px 16px;
  display: flex; flex-direction: column; gap: 10px;
  transform-origin: 50% 0; backface-visibility: hidden;
}
.mpage::before {
  content: ""; position: absolute; top: 9px; left: 10px; right: 10px; height: 4px;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--p-ink) 22%, transparent) 1.5px, transparent 1.8px);
  background-size: 9px 4px;
}
.mpage.leaving { position: absolute; inset: 0 0 auto 0; z-index: 2; animation: flip-up 0.6s cubic-bezier(.4, 0, .7, .4) forwards; }
.mpage.under { position: absolute; inset: 0 0 auto 0; z-index: 0; }
.mpage.coming { z-index: 2; animation: flip-down 0.6s cubic-bezier(.3, .6, .4, 1) both; }
@keyframes flip-up {
  0% { transform: none; box-shadow: none; }
  100% { transform: rotateX(100deg); opacity: 0; box-shadow: 0 -20px 30px rgba(42, 36, 51, 0.2); }
}
@keyframes flip-down {
  0% { transform: rotateX(100deg); opacity: 0; }
  100% { transform: none; opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .mpage.leaving, .mpage.coming { animation-duration: 0.01s; }
}
.mnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mnav .btn { height: 40px; padding: 0 16px; font-size: var(--fs-sm); }
.mnav .count { font-size: var(--fs-tag); color: var(--c-text-2); }
.mpage .mgrid { border-radius: var(--radius-sm); }

/* 聲音開關 */
.tool.sound[aria-pressed="false"] { color: var(--c-text-3); }

/* ─── 版面：手機一欄；桌機日曆在左、工具在右 ─── */
.stage { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "chips" "cal" "side"; }
.stage > .chips { grid-area: chips; }
.stage > .cal { grid-area: cal; }
.stage > .side { grid-area: side; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 900px) {
  .wrap { max-width: 1040px; padding-inline: 32px; gap: 24px; }
  .stage { grid-template-columns: minmax(0, 480px) minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "cal chips" "cal side"; column-gap: 48px; row-gap: 16px; align-items: start; }
  .stage > .side { position: sticky; top: 24px; }
  .mstage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 640px); grid-template-areas: "info cal" "nav cal"; grid-template-rows: auto 1fr; column-gap: 48px; row-gap: 16px; align-items: start; }
  .mstage > .card { grid-area: info; }
  .mstage > .cal { grid-area: cal; }
  .mstage > .mside { grid-area: nav; position: sticky; top: 24px; display: flex; flex-direction: column; gap: 16px; }
  .wrap > .foot { margin-top: 24px; }
}

/* ─── 彈窗 ─── */

<script>
(() => {
  // ───────── 小工具 ─────────
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad2 = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const todayStr = () => ymd(new Date());
  const dayKey = (s) => "d-" + s.replace(/-/g, "");
  const WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  const MONTH_ZH = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];

  const ICON = {
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
    eraser: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20H8l-4-4 10-10 6 6-7 7"/><path d="M9 11l6 6"/></svg>',
    undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h4l5-4v12l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h4l5-4v12l-5-4H4z"/><path d="M17 10l4 4M21 10l-4 4"/></svg>',
  };

  // ───────── 聲音：用 Web Audio 現場合成，不用外部音檔；第一次按下去之後才會出聲 ─────────
  const SOUND_KEY = "cal404-sound";
  const Sound = {
    ctx: null,
    on: (() => { try { return localStorage.getItem(SOUND_KEY) !== "off"; } catch { return true; } })(),
    toggle() { this.on = !this.on; try { localStorage.setItem(SOUND_KEY, this.on ? "on" : "off"); } catch {} },
    ready() {
      if (!this.on) return null;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { this.ctx = this.ctx || new AC(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch { return null; }
      return this.ctx;
    },
    // 紙的聲音：一段雜訊，裡面夾著隨機的小爆裂（纖維一根一根斷），再用帶通濾波器調成紙的音色
    paper({ dur, from, to, vol, crackle, attack }) {
      const ctx = this.ready();
      if (!ctx) return;
      const sr = ctx.sampleRate, n = Math.floor(sr * dur);
      const buf = ctx.createBuffer(1, n, sr);
      const d = buf.getChannelData(0);
      let grain = 0;
      for (let i = 0; i < n; i++) {
        const t = i / n;
        if (Math.random() < crackle) grain = 0.6 + Math.random() * 0.8;
        grain *= 0.996;
        const env = Math.min(1, t / attack) * Math.pow(1 - t, 1.6);
        d[i] = (Math.random() * 2 - 1) * (0.25 + grain) * env;
      }
      const now = ctx.currentTime;
      const src = ctx.createBufferSource(); src.buffer = buf;
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 350;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.8;
      bp.frequency.setValueAtTime(from, now); bp.frequency.exponentialRampToValueAtTime(to, now + dur);
      const g = ctx.createGain(); g.gain.value = vol;
      src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start(now);
    },
    tear() { this.paper({ dur: 0.62, from: 1400, to: 3600, vol: 0.9, crackle: 0.006, attack: 0.08 }); },
    flip() { this.paper({ dur: 0.32, from: 900, to: 2200, vol: 0.45, crackle: 0.0015, attack: 0.25 }); },
  };
  const reduceMotion = () => window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;

  // ───────── 風格 ─────────
  const PRESETS = [
    { name: "抹茶牛奶", mood: "清爽、像剛洗好的蔬菜", paper: "#FFFDF6", ink: "#2A2433", accent: "#D3E5D7", accent2: "#8DB99C", pens: ["#2A2433", "#5F9477", "#D98BA3", "#E0B44C"], pattern: "grid", numberStyle: "solid", corner: "zigzag" },
    { name: "櫻花收據", mood: "有點吵、有點甜，像夜市的收據", paper: "#FFFCF8", ink: "#2A2433", accent: "#F2E9EC", accent2: "#DDA9BA", pens: ["#2A2433", "#C9708F", "#5F9477", "#E0B44C"], pattern: "stripes", numberStyle: "solid", corner: "zigzag" },
    { name: "奶油草稿", mood: "安靜、適合半夜亂畫", paper: "#FFFDF4", ink: "#2A2433", accent: "#FFFFCD", accent2: "#E7C76A", pens: ["#2A2433", "#C79A36", "#5F9477", "#D98BA3"], pattern: "dots", numberStyle: "outline", corner: "straight" },
  ];
  const PATTERNS = ["dots", "stripes", "grid", "waves", "checks", "none"];

  function lum(hex) {
    const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  const isHex = (v) => typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v);

  // AI 回來的東西不一定乖，逐欄檢查，不合格就換回品牌預設
  function normalizeStyle(raw) {
    const base = PRESETS[0];
    const s = { ...base };
    if (!raw || typeof raw !== "object") return s;
    // 舊版的三個現成風格換成這版的配色：只換畫面，存檔要到按儲存才會變
    const oldPreset = ["青綠便當", "粉色收據", "薰衣草草稿"].indexOf(raw.name);
    if (oldPreset >= 0) return { ...PRESETS[oldPreset] };
    s.name = typeof raw.name === "string" && raw.name.trim() ? raw.name.trim().slice(0, 10) : "我的日曆";
    s.mood = typeof raw.mood === "string" ? raw.mood.trim().slice(0, 40) : "";
    for (const k of ["paper", "ink", "accent", "accent2"]) if (isHex(raw[k])) s[k] = raw[k].toUpperCase();
    if (lum(s.paper) < 0.8 || s.paper === "#FFFFFF") s.paper = "#FFFDF6";
    if (contrast(s.ink, s.paper) < 7) s.ink = "#2A2433";
    if (contrast(s.ink, s.accent) < 4.5) s.accent = base.accent;
    s.pens = Array.isArray(raw.pens) ? raw.pens.filter(isHex).slice(0, 4).map((c) => c.toUpperCase()) : [];
    if (!s.pens.includes(s.ink)) s.pens.unshift(s.ink);
    for (const c of base.pens) if (s.pens.length < 4 && !s.pens.includes(c)) s.pens.push(c);
    s.pens = s.pens.slice(0, 4);
    s.pattern = PATTERNS.includes(raw.pattern) ? raw.pattern : "dots";
    s.numberStyle = raw.numberStyle === "outline" ? "outline" : "solid";
    s.corner = ["zigzag", "straight"].includes(raw.corner) ? raw.corner : "zigzag";
    return s;
  }
  const styleVars = (s) => `--p-paper:${s.paper};--p-ink:${s.ink};--p-accent:${s.accent};--p-accent2:${s.accent2}`;

  // ───────── 存放：登入時存雲端（只有自己看得到），不然存這台瀏覽器 ─────────
  async function makeStore() {
    const mem = {};
    let ls = null;
    try { localStorage.setItem("cal404:__t", "1"); localStorage.removeItem("cal404:__t"); ls = localStorage; } catch {}
    const local = {
      kind: ls ? "local" : "memory",
      async all() {
        const out = { ...mem };
        if (ls) for (let i = 0; i < ls.length; i++) {
          const k = ls.key(i);
          if (k && k.startsWith("cal404:") && k !== "cal404:__t") { try { out[k.slice(7)] = JSON.parse(ls.getItem(k)); } catch {} }
        }
        return out;
      },
      async set(k, v) { mem[k] = v; if (ls) ls.setItem("cal404:" + k, JSON.stringify(v)); },
      async del(k) { delete mem[k]; if (ls) { try { ls.removeItem("cal404:" + k); } catch {} } },
    };
    try {
      if (!window.claude?.use) return local;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return local;
      const id = await user.id();
      if (!id) return local;
      const col = db.collection("data/users/" + id);
      return {
        kind: "cloud",
        async all() { const snap = await col.get(); const out = {}; snap.docs.forEach((d) => { if (d.exists) out[d.id] = d.data(); }); return out; },
        async set(k, v) { await col.doc(k).set(v); },
        async del(k) { await col.doc(k).delete(); },
      };
    } catch { return local; }
  }

  // ───────── 狀態 ─────────
  const webDownloads = {
    async save({ filename, data }) {
      const url = URL.createObjectURL(data);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    },
  };
  const defaultCal = () => ({ goal: "每天畫一張畫", start: todayStr(), len: 30, style: { ...PRESETS[0] }, createdAt: Date.now() });
  const S = {
    store: null, sample: null, aiImages: false, downloads: webDownloads,
    cal: null, calSaved: false, days: {}, view: "today", msg: "", msgErr: false,
    live: null, // 今天那頁的畫布
    mIdx: null, // 月曆翻到第幾個月
  };
  const imgSrc = (rec) => (rec?.asset ? "/_blob/" + rec.asset : rec?.data || "");
  const hasArt = (rec) => !!(rec && (rec.asset || rec.data));

  function rangeDays() {
    const out = [];
    for (let i = 0; i < S.cal.len; i++) out.push(addDays(S.cal.start, i));
    return out;
  }

  // 今天這一疊最上面是哪一頁：最早一頁還沒撕的（≦今天），補畫也從這裡來
  function currentPage() {
    const t = todayStr();
    const days = rangeDays();
    const last = days[days.length - 1];
    if (t < S.cal.start) return { kind: "notyet", date: S.cal.start };
    for (const d of days) {
      if (d > t) break;
      if (!S.days[dayKey(d)]?.torn) return { kind: "open", date: d };
    }
    if (t >= last) return { kind: "done" };
    return { kind: "tomorrow", date: addDays(t, 1) };
  }

  function stats() {
    const days = rangeDays();
    const t = todayStr();
    const drawn = days.filter((d) => hasArt(S.days[dayKey(d)])).length;
    const torn = days.filter((d) => S.days[dayKey(d)]?.torn).length;
    let streak = 0;
    let d = hasArt(S.days[dayKey(t)]) ? t : addDays(t, -1);
    while (d >= S.cal.start && hasArt(S.days[dayKey(d)])) { streak++; d = addDays(d, -1); }
    return { drawn, torn, streak, total: days.length };
  }

  function setMsg(text, err = false) { S.msg = text; S.msgErr = err; const el = $("#status"); if (el) { el.textContent = text; el.classList.toggle("err", err); } }

  async function ensureCal() {
    if (S.calSaved) return;
    await S.store.set("cal", S.cal);
    S.calSaved = true;
  }

  // ───────── 畫布 ─────────
  const CANVAS_PX = 720;

  function toolbarHTML(st) {
    const sizes = [{ w: 4, label: "細" }, { w: 10, label: "中" }, { w: 22, label: "粗" }];
    return `
      <div class="tools" role="toolbar" aria-label="畫筆顏色和粗細">
        ${st.pens.map((c, i) => `<button type="button" class="swatch" data-color="${c}" style="background:${c}" aria-label="顏色 ${i + 1}" aria-pressed="${i === 0}"></button>`).join("")}
        <span class="spacer"></span>
        ${sizes.map((s, i) => `<button type="button" class="tool" data-size="${s.w}" aria-label="${s.label}" aria-pressed="${i === 1}"><span class="dot" style="width:${Math.max(4, s.w / 2)}px;height:${Math.max(4, s.w / 2)}px"></span></button>`).join("")}
      </div>
      <div class="tools" role="toolbar" aria-label="工具">
        <button type="button" class="tool" data-tool="pen" aria-label="筆" aria-pressed="true">${ICON.pencil}</button>
        <button type="button" class="tool" data-tool="eraser" aria-label="橡皮擦" aria-pressed="false">${ICON.eraser}</button>
        <button type="button" class="tool" data-x="undo" aria-label="復原">${ICON.undo}</button>
        <button type="button" class="tool" data-x="clear" aria-label="全部擦掉">${ICON.trash}</button>
      </div>`;
  }

  // 把一個 <canvas> 變成可以畫畫、寫字的板子；root 裡要有 toolbarHTML 的按鈕
  function makeBoard(cv, root, st, { src, onChange, onStart } = {}) {
    const ctx = cv.getContext("2d");
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const pen = { color: st.pens[0], size: 10, tool: "pen" };
    const history = [];
    const board = { dirty: false };
    const snapshot = () => { history.push(ctx.getImageData(0, 0, CANVAS_PX, CANVAS_PX)); if (history.length > 20) history.shift(); };
    const changed = () => { board.dirty = true; onChange?.(); };

    if (src) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, CANVAS_PX, CANVAS_PX); img.src = src; }

    const pick = (sel, btn) => root.querySelectorAll(sel).forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    root.querySelectorAll("[data-color]").forEach((b) => b.addEventListener("click", () => { pen.color = b.dataset.color; pen.tool = "pen"; pick("[data-color]", b); pick("[data-tool]", root.querySelector('[data-tool="pen"]')); }));
    root.querySelectorAll("[data-size]").forEach((b) => b.addEventListener("click", () => { pen.size = Number(b.dataset.size); pick("[data-size]", b); }));
    root.querySelectorAll("[data-tool]").forEach((b) => b.addEventListener("click", () => { pen.tool = b.dataset.tool; pick("[data-tool]", b); }));
    root.querySelector('[data-x="undo"]').addEventListener("click", () => { const h = history.pop(); if (h) { ctx.putImageData(h, 0, 0); changed(); } });
    root.querySelector('[data-x="clear"]').addEventListener("click", () => { snapshot(); ctx.clearRect(0, 0, CANVAS_PX, CANVAS_PX); changed(); });

    let drawing = false, last = null, mid = null;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * CANVAS_PX, y: ((e.clientY - r.top) / r.height) * CANVAS_PX }; };
    const style = (e) => {
      ctx.globalCompositeOperation = pen.tool === "eraser" ? "destination-out" : "source-over";
      ctx.strokeStyle = pen.color; ctx.fillStyle = pen.tool === "eraser" ? "#000" : pen.color;
      const pressure = e.pointerType === "pen" && e.pressure > 0 ? 0.5 + e.pressure : 1;
      ctx.lineWidth = (pen.tool === "eraser" ? pen.size * 2.2 : pen.size) * pressure;
    };
    cv.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      cv.setPointerCapture(e.pointerId);
      onStart?.();
      snapshot(); drawing = true;
      last = pos(e); mid = last;
      style(e);
      ctx.beginPath(); ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
    });
    cv.addEventListener("pointermove", (e) => {
      if (!drawing) return;
      e.preventDefault();
      const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      for (const ev of list.length ? list : [e]) {
        const p = pos(ev);
        const m2 = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
        style(ev);
        ctx.beginPath(); ctx.moveTo(mid.x, mid.y); ctx.quadraticCurveTo(last.x, last.y, m2.x, m2.y); ctx.stroke();
        last = p; mid = m2;
      }
    });
    const end = () => { if (!drawing) return; drawing = false; ctx.globalCompositeOperation = "source-over"; changed(); };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);

    board.isEmpty = () => {
      const px = ctx.getImageData(0, 0, CANVAS_PX, CANVAS_PX).data;
      for (let i = 3; i < px.length; i += 4 * 5) if (px[i] > 8) return false;
      return true;
    };
    board.canvas = cv;
    return board;
  }

  function canvasToBlob(c, type, q) { return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("轉不出圖片"))), type, q)); }
  const blobToDataURL = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });

  // 把畫存成那天的頁；畫布全空就把畫拿掉
  async function saveDrawing(date, board) {
    await ensureCal();
    const key = dayKey(date);
    const prev = S.days[key] || {};
    const rec = { torn: !!prev.torn, savedAt: Date.now() };
    if (!board.isEmpty()) {
      const out = document.createElement("canvas");
      out.width = out.height = CANVAS_PX;
      const o = out.getContext("2d");
      o.fillStyle = S.cal.style.paper; o.fillRect(0, 0, CANVAS_PX, CANVAS_PX);
      o.drawImage(board.canvas, 0, 0);
      let q = 0.86, data;
      do { data = await blobToDataURL(await canvasToBlob(out, "image/jpeg", q)); q -= 0.12; } while (data.length > 200000 && q > 0.3);
      rec.data = data;
    }
    await S.store.set(key, rec);
    S.days[key] = rec;
  }

  // 今天那頁：停筆 1.2 秒自動貼上日曆
  let saveTimer = null, savePromise = null;
  function scheduleSave(date) {
    clearTimeout(saveTimer);
    setMsg("畫畫中⋯");
    saveTimer = setTimeout(() => flushSave(date), 1200);
  }
  async function flushSave(date) {
    clearTimeout(saveTimer); saveTimer = null;
    if (savePromise) await savePromise;
    if (!S.live || !S.live.dirty) return;
    S.live.dirty = false;
    savePromise = saveDrawing(date, S.live)
      .then(() => { setMsg(hasArt(S.days[dayKey(date)]) ? "貼上日曆了" : ""); refreshTodayBits(date); })
      .catch(() => { S.live.dirty = true; setMsg("存不起來，網路好像斷了", true); })
      .finally(() => { savePromise = null; });
    await savePromise;
  }
  // 不重畫整頁（畫布會被洗掉），只更新數字和按鈕
  function refreshTodayBits(date) {
    const art = hasArt(S.days[dayKey(date)]);
    const tearBtn = $('[data-act="tear"]'); if (tearBtn) tearBtn.disabled = !art;
    const saveBtn = $('[data-act="save"]'); if (saveBtn) saveBtn.disabled = !art;
    const foot = $("#sheet-note"); if (foot) foot.textContent = art ? "畫好了，可以撕" : "";
    const chips = $("#chips"); if (chips) chips.innerHTML = chipsHTML();
  }

  // ───────── 畫面 ─────────
  function render() {
    const app = $("#app");
    if (!S.store) { app.innerHTML = '<div class="loading">翻日曆中⋯</div>'; return; }
    S.live = null;
    app.innerHTML = headerView() + (S.view === "month" ? monthView() : todayView()) + footView();
    bindMain();
    T3.afterRender();
  }

  function headerView() {
    return `
      <header class="top">
        <div>
          <div class="eyebrow mono">ORDER #404 · DAY 6</div>
          <h1>自製日曆</h1>
        </div>
        <div class="top-right">
          <div class="seg" role="group" aria-label="切換畫面">
            <button type="button" data-view="today" aria-pressed="${S.view === "today"}">今天</button>
            <button type="button" data-view="month" aria-pressed="${S.view === "month"}">月曆</button>
          </div>
          <button type="button" class="tool sound" data-act="sound" aria-label="撕頁聲音" aria-pressed="${Sound.on}">${Sound.on ? ICON.soundOn : ICON.soundOff}</button>
          <button type="button" class="tool" data-act="settings" aria-label="設定">${ICON.gear}</button>
        </div>
      </header>`;
  }

  function footView() {
    const where = S.store.kind === "cloud" ? "畫的東西存在你的帳號裡，只有你看得到" : S.store.kind === "local" ? "現在沒登入，畫的東西只存在這台瀏覽器" : "這個畫面存不了東西，關掉就沒了";
    return `<p class="foot">${where}<br>404 廚房 · 自製日曆</p>`;
  }

  function chipsHTML() {
    const s = stats();
    return `<span class="chip lime">畫了 ${s.drawn} 張</span>
      <span class="chip lime">撕了 ${s.torn} / ${s.total} 頁</span>
      ${s.streak > 1 ? `<span class="chip lime">連續 ${s.streak} 天</span>` : ""}`;
  }

  // 一張日曆紙；art 是中間那塊要放的東西
  function sheetHTML(date, style, { art, foot = "", locked = false, id = "", total, curl = false } = {}) {
    const d = parse(date);
    return `
      <article class="sheet ${curl ? "curl" : ""} ${locked ? "locked" : ""}" ${id ? `id="${id}"` : ""} style="${styleVars(style)}">
        <div class="sheet-head">
          <div class="daynum ${style.numberStyle === "outline" ? "outline" : ""}">${d.getDate()}</div>
          <div class="dayside">
            <div class="weekday">${WEEK[d.getDay()]}</div>
          </div>
        </div>
        ${art}
        <div class="sheet-foot"><span id="sheet-note">${foot}</span></div>
      </article>`;
  }

  function boardHTML(date, style, goal) {
    const d = parse(date);
    return `
      ${NAIL}<svg class="hanger" viewBox="0 0 200 36" preserveAspectRatio="none" aria-hidden="true">
        <path d="M100 7 L14 36 M100 7 L186 36" stroke="currentColor" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="board ${style.pattern !== "none" ? "pat-" + style.pattern : ""}" style="${styleVars(style)}">
        <div>
          <div class="ym mono">${d.getFullYear()}.${pad2(d.getMonth() + 1)}</div>
          <div class="month">${MONTH_ZH[d.getMonth()]}</div>
        </div>
        <div class="goal">${esc(goal)}</div>
        <div class="staples" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>`;
  }
  // 釘子：疊在掛繩頂端
  const NAIL = '<span class="nail" aria-hidden="true"></span>';

  // 下面還有幾頁，決定紙疊的厚度
  function padBits(st, tornCount, under) {
    const thick = under <= 0 ? 0 : Math.round(3 + Math.min(1, under / 30) * 9);
    return {
      cls: st.corner === "zigzag" ? "zigzag" : "",
      top: tornCount > 0 ? '<div class="stubs" aria-hidden="true"></div>' : "",
      bottom: thick ? `<div class="edges" style="--thick:${thick}px" aria-hidden="true"></div>` : "",
    };
  }

  function todayView() {
    const st = S.cal.style;
    const cur = currentPage();
    const s = stats();
    const t = todayStr();
    let sheet, below = "", padClass = "";
    const pb = padBits(st, s.torn, S.cal.len - s.torn - 1);
    if (cur.kind === "open") {
      const rec = S.days[dayKey(cur.date)];
      const art = hasArt(rec);
      const late = cur.date < t ? `${parse(cur.date).getMonth() + 1}/${parse(cur.date).getDate()} 那頁還沒撕` : "";
      sheet = sheetHTML(cur.date, st, {
        id: "top-sheet", curl: true,
        foot: late || (art ? "畫好了，可以撕" : ""),
        art: `<div class="art live" style="background:${st.paper}">
                <canvas id="live" width="${CANVAS_PX}" height="${CANVAS_PX}" aria-label="今天這頁的畫布，可以畫畫、寫字"></canvas>
                ${art ? "" : `<div class="ph" id="ph">${ICON.pencil}<span>直接在這裡畫畫、寫字</span></div>`}
              </div>`,
      });
      below = `
        <div class="drawbar" id="drawbar">${toolbarHTML(st)}</div>
        <div class="actions">
          <button type="button" class="btn primary" data-act="tear" data-date="${cur.date}" ${art ? "" : "disabled"}>撕下來</button>
          <button type="button" class="btn t3-b-rest" data-act="draw3">拿起來畫</button>
          <button type="button" class="btn t3-b-draw" data-act="done3">掛回去</button>
          ${S.downloads ? `<button type="button" class="btn" data-act="save" data-date="${cur.date}" ${art ? "" : "disabled"}>存成圖片</button>` : ""}
        </div>
        <p class="hint t3-hint"></p>`;
    } else if (cur.kind === "tomorrow") {
      sheet = sheetHTML(cur.date, st, { locked: true, art: `<div class="lockmsg">明天再來撕下一頁。</div>` });
      below = `<div class="actions"><button type="button" class="btn" data-view="month">看撕下來的頁</button></div>`;
    } else if (cur.kind === "notyet") {
      const d = parse(cur.date);
      sheet = sheetHTML(cur.date, st, { locked: true, art: `<div class="lockmsg">${d.getMonth() + 1} 月 ${d.getDate()} 日開始撕第一頁</div>`, foot: "還沒開始" });
    } else {
      padClass = "empty";
      sheet = `<article class="sheet" style="${styleVars(st)}"><div class="lockmsg">${S.cal.len} 頁都撕完了。<br>畫了 ${s.drawn} 張，這本日曆是你自己做的。</div></article>`;
      below = `<div class="actions"><button type="button" class="btn primary" data-view="month">看整本</button><button type="button" class="btn" data-act="settings">再做一本</button></div>`;
    }
    return `
      <div class="stage">
        <div class="chips" id="chips">${chipsHTML()}</div>
        <section class="cal" style="${styleVars(st)}" aria-label="撕日曆">
          ${boardHTML(cur.date || t, st, S.cal.goal)}
          <div class="pad ${pb.cls} ${padClass}" id="pad">${pb.top}${sheet}${padClass === "empty" ? "" : pb.bottom}</div>
        </section>
        <div class="side">
          ${below}
          <div class="status ${S.msgErr ? "err" : ""}" id="status" role="status">${esc(S.msg)}</div>
        </div>
      </div>`;
  }

  function monthList() {
    const months = [];
    for (const d of rangeDays()) {
      const m = d.slice(0, 7);
      if (!months.length || months[months.length - 1] !== m) months.push(m);
    }
    return months;
  }
  // 一進月曆先翻到今天那個月
  function monthIndex(months) {
    if (S.mIdx == null || S.mIdx >= months.length) {
      const t = todayStr().slice(0, 7);
      const i = months.indexOf(t);
      S.mIdx = i >= 0 ? i : t < months[0] ? 0 : months.length - 1;
    }
    return S.mIdx;
  }

  function monthView() {
    const st = S.cal.style;
    const months = monthList();
    const i = monthIndex(months);
    const s = stats();
    const pb = padBits(st, 0, months.length - i - 1);
    return `
      <div class="mstage">
        <div class="card">
          <div class="card-head">
            <p class="hint">${S.cal.start.replace(/-/g, ".")} 起，共 ${S.cal.len} 頁 · 風格<span class="nowrap">「${esc(st.name)}」</span></p>
          </div>
          <div class="legend"><span>✓ 撕下來了</span><span><span style="color:var(--c-rose-deep)">●</span> 那天沒畫，點了可以補</span></div>
        </div>
        <section class="cal" style="${styleVars(st)}" aria-label="月曆">
          ${boardHTML(months[i] + "-01", st, S.cal.goal)}
          <div class="pad ${pb.cls}">
            <div class="mpages" id="mpages">${monthPageHTML(months[i])}</div>
            ${pb.bottom || `<div class="edges" style="--thick:3px" aria-hidden="true"></div>`}
          </div>
        </section>
        <div class="mside">
          ${months.length > 1 ? `
          <div class="mnav">
            <button type="button" class="btn" data-mnav="-1" ${i === 0 ? "disabled" : ""}>翻回上個月</button>
            <span class="count mono" id="mcount">${i + 1} / ${months.length}</span>
            <button type="button" class="btn" data-mnav="1" ${i === months.length - 1 ? "disabled" : ""}>翻到下個月</button>
          </div>` : ""}
          <div class="status ${S.msgErr ? "err" : ""}" id="status" role="status">${esc(S.msg)}</div>
        </div>
      </div>`;
  }

  // 一個月的那一頁
  function monthPageHTML(m, cls = "") {
    const days = rangeDays();
    const t = todayStr();
    const inRange = new Set(days);
    {
      const [y, mo] = m.split("-").map(Number);
      const lead = (new Date(y, mo - 1, 1).getDay() + 6) % 7; // 週一開頭
      const count = new Date(y, mo, 0).getDate();
      let cells = ["一", "二", "三", "四", "五", "六", "日"].map((w) => `<div class="wd">${w}</div>`).join("");
      for (let i = 0; i < lead; i++) cells += `<div class="mcell out"><span>.</span></div>`;
      for (let n = 1; n <= count; n++) {
        const ds = `${m}-${pad2(n)}`;
        const rec = S.days[dayKey(ds)];
        if (!inRange.has(ds)) { cells += `<div class="mcell out"><span>${n}</span></div>`; continue; }
        const future = ds > t;
        const art = hasArt(rec);
        const cls = ["mcell", art ? "has" : "", future ? "future" : "", ds === t ? "today" : "", rec?.torn && art ? "kept" : "", !future && !art && ds < t ? "miss" : ""].join(" ");
        const label = `${mo} 月 ${n} 日` + (art ? "，已畫" : future ? "，還沒到" : "，還沒畫");
        cells += future
          ? `<div class="${cls}" aria-label="${label}"><span>${n}</span></div>`
          : `<button type="button" class="${cls}" data-act="${art ? "view" : "draw"}" data-date="${ds}" aria-label="${label}"><span>${n}</span>${art ? `<img src="${esc(imgSrc(rec))}" alt="" loading="lazy">` : ""}</button>`;
      }
      const tail = (7 - ((lead + count) % 7)) % 7;
      for (let i = 0; i < tail; i++) cells += `<div class="mcell out"><span>.</span></div>`;
      return `<div class="mpage ${cls}" data-month="${m}" role="group" aria-label="${y} 年 ${MONTH_ZH[mo - 1]}"><div class="mgrid">${cells}</div></div>`;
    }
  }

  // 翻月：往後是這頁往上翻走、露出下一頁；往前是上一頁從上面翻下來蓋住
  let flipping = false;
  function flipMonth(dir) {
    const months = monthList();
    const ni = S.mIdx + dir;
    const box = $("#mpages");
    if (!box || flipping || ni < 0 || ni >= months.length) return;
    const old = box.querySelector(".mpage");
    const tmp = document.createElement("div");
    tmp.innerHTML = monthPageHTML(months[ni]);
    const neu = tmp.firstElementChild;
    S.mIdx = ni;
    Sound.flip();
    bindCells(neu);
    const finish = () => { flipping = false; old.remove(); neu.classList.remove("coming"); };
    if (reduceMotion()) { old.replaceWith(neu); flipping = false; }
    else {
      flipping = true;
      if (dir > 0) { old.classList.add("leaving"); box.appendChild(neu); old.addEventListener("animationend", finish, { once: true }); }
      else { old.classList.add("under"); neu.classList.add("coming"); box.appendChild(neu); neu.addEventListener("animationend", finish, { once: true }); }
      setTimeout(() => { if (flipping) finish(); }, 900);
    }
    // 板頭的年月、按鈕、頁數跟著換
    const [y, mo] = months[ni].split("-").map(Number);
    const ym = $(".board .ym"); if (ym) ym.textContent = `${y}.${pad2(mo)}`;
    const mn = $(".board .month"); if (mn) mn.textContent = MONTH_ZH[mo - 1];
    const prev = $('[data-mnav="-1"]'); if (prev) prev.disabled = ni === 0;
    const next = $('[data-mnav="1"]'); if (next) next.disabled = ni === months.length - 1;
    const cnt = $("#mcount"); if (cnt) cnt.textContent = `${ni + 1} / ${months.length}`;
    const edges = $(".mstage .edges");
    if (edges) edges.style.setProperty("--thick", `${Math.max(3, Math.round(3 + Math.min(1, (months.length - ni - 1) / 30) * 9))}px`);
  }

  // ───────── 主畫面動作 ─────────
  function bindMain() {
    document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", async () => {
      const cur = S.cal && currentPage();
      if (S.live && cur?.date) await flushSave(cur.date);
      if (b.dataset.view === "month" && S.view !== "month") S.mIdx = null;
      S.view = b.dataset.view; S.msg = ""; S.msgErr = false; render(); window.scrollTo({ top: 0 });
    }));
    bindCells(document);
    document.querySelectorAll('[data-act="sound"]').forEach((b) => b.addEventListener("click", () => {
      Sound.toggle();
      b.setAttribute("aria-pressed", String(Sound.on));
      b.innerHTML = Sound.on ? ICON.soundOn : ICON.soundOff;
      if (Sound.on) Sound.flip();
    }));
    document.querySelectorAll("[data-mnav]").forEach((b) => b.addEventListener("click", () => flipMonth(Number(b.dataset.mnav))));
    // 月曆左右滑也能翻
    const mp = $("#mpages");
    if (mp) {
      let sx = null, sy = 0;
      mp.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; });
      mp.addEventListener("pointerup", (e) => {
        if (sx == null) return;
        const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) flipMonth(dx < 0 ? 1 : -1);
      });
      mp.addEventListener("pointercancel", () => { sx = null; });
    }
    document.querySelectorAll('[data-act="tear"]').forEach((b) => b.addEventListener("click", () => tear(b.dataset.date)));
    document.querySelectorAll('[data-act="draw3"]').forEach((b) => b.addEventListener("click", () => T3.enterDraw()));
    document.querySelectorAll('[data-act="done3"]').forEach((b) => b.addEventListener("click", () => T3.exitDraw()));
    document.querySelectorAll('[data-act="save"]').forEach((b) => b.addEventListener("click", async () => { await flushSave(b.dataset.date); savePageImage(b.dataset.date); }));
    document.querySelectorAll('[data-act="settings"]').forEach((b) => b.addEventListener("click", async () => {
      const cur = currentPage();
      if (S.live && cur.date) await flushSave(cur.date);
      openSettings();
    }));

        onChange: () => scheduleSave(date),

  }

  // 撕下來的那頁：複製一份蓋在原位往下掉，底下馬上換成下一頁
  function makeGhost(sheet) {
    const r = sheet.getBoundingClientRect();
    const g = sheet.cloneNode(true);
    g.removeAttribute("id");
    g.classList.remove("curl");
    g.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
    const from = sheet.querySelector("canvas"), to = g.querySelector("canvas");
    if (from && to) to.getContext("2d").drawImage(from, 0, 0);
    // 上緣撕得不整齊
    const pts = ["0% 100%", "100% 100%"];
    for (let x = 100; x >= 0; x -= 4) pts.push(`${x}% ${(Math.random() * 5).toFixed(1)}px`);
    g.style.cssText += `;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;clip-path:polygon(${pts.join(",")})`;
    g.classList.add("ghost");
    document.body.appendChild(g);
    const drop = () => g.remove();
    g.addEventListener("animationend", drop, { once: true });
    setTimeout(drop, 1200);
  }

  async function tear(date) {
    if (T3.busy()) return;
    if (T3.drawing()) await T3.exitDraw(); // 先把畫好的貼回 3D 的紙，再撕
    await flushSave(date);
    if (!hasArt(S.days[dayKey(date)])) { setMsg("先畫點東西再撕", true); T3.springBack(); return; }
    const sheet = $("#top-sheet");
    const rec = { ...S.days[dayKey(date)], torn: true, tornAt: Date.now() };
    try { await S.store.set(dayKey(date), rec); }
    catch { setMsg("撕不下來，網路好像斷了", true); T3.springBack(); return; }
    S.days[dayKey(date)] = rec;
    Sound.tear();
    if (T3.active()) T3.startTear();
    else if (sheet) makeGhost(sheet);
    S.msg = "撕下來了，收進月曆"; S.msgErr = false;
    render();
  }

      <button type="button" class="close" aria-label="關閉">${ICON.x}</button><div class="modal-body">${html}</div></div>`;
    document.body.appendChild(m);
    document.body.style.overflow = "hidden";
    const close = () => { m.remove(); if (!document.querySelector(".modal")) document.body.style.overflow = ""; document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape" && m === [...document.querySelectorAll(".modal")].pop()) close(); };
    document.addEventListener("keydown", onKey);
    $(".close", m).addEventListener("click", close);
    m.addEventListener("click", (e) => { if (e.target === m) close(); });
    return { el: m, body: $(".modal-body", m), close };

  async function generateStyle(sd, redraw) {
    if (sd.busy) return;

請從照片的顏色、材質、氣氛，幫他設計一本撕日曆的風格。限制：
- 底色 paper 要很淺（接近白），整體以白為主
- ink 是字和線的顏色，要很深，在 paper 上清楚好讀
- accent 是日曆板頭的大色塊，從照片裡取最有代表性的顏色，ink 放在上面要看得清楚
- accent2 是板頭底紋用的顏色，比 accent 深
- pens 是 4 支畫筆的顏色，第一支用 ink，其他從照片取
- pattern 從 dots、stripes、grid、waves、checks、none 選一個最像照片質感的
- numberStyle 選 solid 或 outline；corner 選 zigzag（像收據的鋸齒）或 straight
- name 是 4 到 6 個字的繁體中文風格名，像菜名；mood 是一句台灣口語短句，講這本日曆的感覺
只回 JSON，格式：{"name":"","mood":"","paper":"#RRGGBB","ink":"#RRGGBB","accent":"#RRGGBB","accent2":"#RRGGBB","pens":["#RRGGBB","#RRGGBB","#RRGGBB","#RRGGBB"],"pattern":"","numberStyle":"","corner":""}`;
    try {
      const raw = await S.sample.json(prompt, { images: sd.photos.map((p) => p.file), modelTier: "default" });
      sd.style = normalizeStyle(raw);
      sd.msg = `做好了：「${sd.style.name}」。喜歡就按儲存。`;

      x.font = `400 48px ${sans}`; x.textAlign = "right"; x.fillText(WEEK[d.getDay()], W - P - 40, top + 150);
      x.font = `500 28px ${mono}`; x.globalAlpha = 0.7; x.fillText(`第 ${diffDays(S.cal.start, date) + 1} / ${S.cal.len} 頁`, W - P - 40, top + 210); x.globalAlpha = 1; x.textAlign = "left";
      const artTop = top + 280, artSize = W - P * 2 - 80;

        x.save(); roundRect(x, P + 40, artTop, artSize, artSize, 20); x.clip(); x.drawImage(img, P + 40, artTop, artSize, artSize); x.restore();
      }

      const blob = await canvasToBlob(c, "image/png");

  function roundRect(x, l, t, w, h, r) { x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r); x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath(); }

  // ───────── 背景：蠟筆感的草和花，用程式畫在一張 2D 畫布上，3D 版和 CSS 版共用 ─────────
  const Garden = (() => {
    const C = {
      wall: "#FAF8EF", sage: "#D3E5D7", sage2: "#B9D6C1", sage3: "#8DB99C", sage4: "#5F9477",
      butter: "#FFFFCD", butter2: "#FBEFA6", butter3: "#E7C76A",
      blush: "#F2E9EC", blush2: "#EFD3DB", blush3: "#DDA9BA",
    };
    let cv = null, lastW = 0, lastH = 0;
    function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    // 蠟筆線：沿路一點一點蓋上去，粗細抖動、偶爾斷掉
    function crayon(x, R, pts, color, w) {
      x.fillStyle = color;
      for (let i = 0; i < pts.length - 1; i++) {
        const [ax, ay] = pts[i], [bx, by] = pts[i + 1], d = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.ceil(d / (w * 0.3)));
        for (let k = 0; k < n; k++) {
          if (R() < 0.06) continue;
          const t = k / n, r = w * (0.36 + R() * 0.22);
          x.beginPath(); x.ellipse(ax + (bx - ax) * t + (R() - 0.5) * w * 0.35, ay + (by - ay) * t + (R() - 0.5) * w * 0.35, r, r * (0.7 + R() * 0.3), R() * 3, 0, 7); x.fill();
        }
      }
    }
    // 粗邊色塊：填滿 → 邊緣蓋一圈不規則的點 → 裡面疊斑駁的色塊和乾掉的小白點
    function patch(x, R, pts, color, mottle, u) {
      x.save();
      x.fillStyle = color; x.beginPath(); pts.forEach((p, i) => (i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]))); x.closePath(); x.fill();
      crayon(x, R, [...pts, pts[0]], color, 7 * u);
      x.clip();
      let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      for (const [a, b] of pts) { minX = Math.min(minX, a); maxX = Math.max(maxX, a); minY = Math.min(minY, b); maxY = Math.max(maxY, b); }
      const W = maxX - minX, H = maxY - minY, n = Math.min(70, Math.max(10, (W * H) / (900 * u * u)));
      for (let i = 0; i < n; i++) {
        x.globalAlpha = 0.1 + R() * 0.16; x.fillStyle = R() < 0.6 ? mottle : "#FFFFFF";
        x.beginPath(); x.ellipse(minX + R() * W, minY + R() * H, (8 + R() * 34) * u, (5 + R() * 20) * u, R() * 3, 0, 7); x.fill();
      }
      x.globalAlpha = 0.45; x.fillStyle = C.wall;
      for (let i = 0; i < n * 9; i++) { const r = (0.4 + R() * 0.9) * u; x.fillRect(minX + R() * W, minY + R() * H, r, r); }
      x.restore();
    }
    const lobed = (R, cx, cy, r, lobes, depth, rot) => {
      const out = [], n = Math.max(48, lobes * 14);
      for (let i = 0; i < n; i++) {
        const t = (i / n) * Math.PI * 2, q = r * (1 - depth + depth * Math.pow(Math.abs(Math.cos(((t + rot) * lobes) / 2)), 0.55)) * (1 + (R() - 0.5) * 0.035);
        out.push([cx + Math.cos(t) * q, cy + Math.sin(t) * q]);
      }
      return out;
    };
    const ray = (cx, cy, a, r0, r1, bend) => {
      const p = [];
      for (let i = 0; i <= 6; i++) { const t = i / 6, q = r0 + (r1 - r0) * t, b = a + bend * Math.sin(t * 3); p.push([cx + Math.cos(b) * q, cy + Math.sin(b) * q]); }
      return p;
    };
    function dots(x, R, cx, cy, r, color, n) {
      x.fillStyle = color;
      for (let i = 0; i < n; i++) { const a = R() * 7, q = r * Math.sqrt(R()); x.beginPath(); x.ellipse(cx + Math.cos(a) * q, cy + Math.sin(a) * q, r * 0.2, r * 0.16, a, 0, 7); x.fill(); }
    }

    const KINDS = {
      // 圓圓的五瓣花，瓣上有放射線
      round(x, R, cx, cy, r, u, c) {
        const rot = R() * 6, lobes = 5;
        patch(x, R, lobed(R, cx, cy, r, lobes, 0.3, rot), c.fill, c.mid, u);
        for (let i = 0; i < lobes; i++) {
          const a = (i * Math.PI * 2) / lobes - rot;
          for (const o of [-0.17, 0, 0.17]) crayon(x, R, ray(cx, cy, a + o, r * 0.42, r * (o ? 0.72 : 0.82), 0.04), c.line, 3.4 * u);
        }
        dots(x, R, cx, cy, r * 0.17, c.eye, 7);
      },
      // 一圈一圈的大花
      rose(x, R, cx, cy, r, u, c) {
        patch(x, R, lobed(R, cx, cy, r, 7, 0.1, R() * 6), c.fill, c.mid, u);
        for (const q of [0.82, 0.6, 0.38]) {
          const n = Math.round(q * 6) + 2, off = R() * 6;
          for (let i = 0; i < n; i++) {
            const a0 = off + (i / n) * 6.283, p = [];
            for (let k = 0; k <= 7; k++) { const a = a0 + (k / 7) * (4.4 / n); p.push([cx + Math.cos(a) * r * q * (1 + 0.05 * Math.sin(k)), cy + Math.sin(a) * r * q * (1 + 0.05 * Math.sin(k))]); }
            crayon(x, R, p, c.line, 3.4 * u);
          }
        }
        patch(x, R, lobed(R, cx, cy, r * 0.17, 5, 0.2, 0), C.wall, c.fill, u);
        dots(x, R, cx, cy, r * 0.09, c.eye, 4);
      },
      // 四瓣十字花
      cross(x, R, cx, cy, r, u, c) {
        const rot = R() * 6;
        patch(x, R, lobed(R, cx, cy, r, 4, 0.62, rot), c.fill, c.mid, u);
        for (let i = 0; i < 4; i++) crayon(x, R, ray(cx, cy, (i * Math.PI) / 2 - rot, r * 0.2, r * 0.78, 0.06), c.line, 3.6 * u);
        patch(x, R, lobed(R, cx, cy, r * 0.11, 6, 0.1, 0), C.wall, c.fill, u);
      },
      // 細瓣雛菊
      daisy(x, R, cx, cy, r, u, c) {
        const rot = R() * 6, lobes = 10;
        patch(x, R, lobed(R, cx, cy, r, lobes, 0.52, rot), c.fill, c.mid, u);
        for (let i = 0; i < lobes; i++) crayon(x, R, ray(cx, cy, (i * Math.PI * 2) / lobes - rot, r * 0.34, r * 0.74, 0.03), c.line, 2.8 * u);
        patch(x, R, lobed(R, cx, cy, r * 0.22, 8, 0.08, 0), C.butter2, C.butter3, u);
      },
      // 毛線球
      pom(x, R, cx, cy, r, u, c) {
        patch(x, R, lobed(R, cx, cy, r, 11, 0.07, R() * 6), c.fill, c.mid, u);
        for (let j = -2; j <= 2; j++) {
          const p = [], y0 = cy + j * r * 0.34, half = r * Math.sqrt(1 - Math.pow(j * 0.34, 2)) * 0.82;
          for (let k = 0; k <= 26; k++) { const t = k / 26; p.push([cx - half + t * half * 2 + Math.sin(t * 22) * r * 0.05, y0 + Math.cos(t * 22) * r * 0.1]); }
          crayon(x, R, p, c.line, 3 * u);
        }
      },
    };
    const TONES = {
      sage: { fill: C.sage, mid: C.sage2, line: C.sage3, eye: C.butter3 },
      deep: { fill: C.sage3, mid: C.sage4, line: C.sage, eye: C.butter },
      butter: { fill: C.butter, mid: C.butter2, line: C.butter3, eye: C.sage3 },
      gold: { fill: C.butter2, mid: C.butter3, line: "#D2A94F", eye: C.sage4 },
      blush: { fill: C.blush, mid: C.blush2, line: C.blush3, eye: C.sage3 },
      rose: { fill: C.blush2, mid: C.blush3, line: C.blush, eye: C.butter3 },
    };

    function flower(x, R, baseX, baseY, cx, cy, r, kind, tone, u) {
      const mx = (baseX + cx) / 2 + (R() - 0.5) * r, p = [];
      for (let i = 0; i <= 18; i++) { const t = i / 18, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t; p.push([a * baseX + b * mx + c * cx, a * baseY + b * (baseY + cy) / 2 + c * cy]); }
      crayon(x, R, p, C.sage4, 6 * u);
      const leaf = (t, s) => {
        const [lx, ly] = p[Math.round(t * 18)], len = r * (0.55 + R() * 0.25), a = -Math.PI / 2 + s * (0.7 + R() * 0.3);
        const tip = [lx + Math.cos(a) * len, ly + Math.sin(a) * len], out = [];
        for (let i = 0; i <= 14; i++) { const q = i / 14, w = Math.sin(q * Math.PI) * len * 0.2; out.push([lx + (tip[0] - lx) * q - Math.sin(a) * w, ly + (tip[1] - ly) * q + Math.cos(a) * w]); }
        for (let i = 14; i >= 0; i--) { const q = i / 14, w = Math.sin(q * Math.PI) * len * 0.2; out.push([lx + (tip[0] - lx) * q + Math.sin(a) * w, ly + (tip[1] - ly) * q - Math.cos(a) * w]); }
        patch(x, R, out, C.sage3, C.sage4, u);
      };
      leaf(0.3, 1); leaf(0.52, -1);
      KINDS[kind](x, R, cx, cy, r, u, TONES[tone]);
    }

    function grass(x, R, w, h, top, u) {
      const band = (y, color, mottle, amp, ph) => {
        const p = [];
        for (let i = 0; i <= 90; i++) { const t = i / 90; p.push([t * (w + 40) - 20, y + Math.sin(t * 7 + ph) * amp + Math.sin(t * 17 + ph * 2) * amp * 0.4]); }
        p.push([w + 20, h + 20], [-20, h + 20]);
        patch(x, R, p, color, mottle, u);
      };
      band(top, C.sage, C.sage2, 12 * u, 1.2);
      blades(x, R, w, top + 6 * u, h, u, 150, [C.sage2, C.sage3]);
      return (y) => { band(y, C.sage2, C.sage3, 9 * u, 3.4); blades(x, R, w, y + 4 * u, h, u, 240, [C.sage3, C.sage4, C.sage]); };
    }
    function blades(x, R, w, y0, h, u, count, cols) {
      const n = Math.round((count * w) / (1000 * u));
      for (let i = 0; i < n; i++) {
        const bx = R() * w, by = y0 + R() * (h - y0) * 0.9, L = (16 + R() * 26) * u, s = (R() - 0.5) * 14 * u;
        crayon(x, R, [[bx, by], [bx + s * 0.3, by - L * 0.55], [bx + s, by - L]], cols[Math.floor(R() * cols.length)], 3.4 * u);
      }
    }

    function paint() {
      const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      const x = cv.getContext("2d"), R = rng(404);
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      x.fillStyle = C.wall; x.fillRect(0, 0, w, h);
      const wide = w >= 900, u = wide ? 1 : 0.72;
      const top = wide ? h * 0.8 : h - 118;
      const front = grass(x, R, w, h, top, u);
      const m = Math.min(w, h);
      const list = wide
        ? [[0.92, 0.46, 0.15, "rose", "sage"], [0.73, 0.55, 0.115, "round", "butter"], [0.985, 0.7, 0.11, "cross", "rose"], [0.84, 0.69, 0.1, "round", "blush"], [0.655, 0.72, 0.075, "pom", "gold"], [0.77, 0.77, 0.07, "daisy", "deep"], [0.94, 0.85, 0.06, "pom", "gold"],
           [0.045, 0.56, 0.1, "round", "blush"], [0.095, 0.72, 0.075, "cross", "sage"], [0.012, 0.76, 0.07, "pom", "gold"]]
        : [[0.99, (h - 268) / h, 0.15, "round", "blush"], [0.02, (h - 244) / h, 0.145, "rose", "sage"], [0.93, (h - 168) / h, 0.11, "pom", "gold"], [0.075, (h - 150) / h, 0.1, "cross", "rose"], [0.5, (h - 118) / h, 0.0, "pom", "gold"]];
      for (const [fx, fy, fr, kind, tone] of list) {
        if (!fr) continue;
        const bx = fx * w + (fx > 0.5 ? -1 : 1) * 40 * u * R();
        flower(x, R, bx, h + 10, fx * w, fy * h, fr * m, kind, tone, u);

    }

    function init() {
      cv = document.createElement("canvas"); cv.id = "garden"; cv.setAttribute("aria-hidden", "true");
