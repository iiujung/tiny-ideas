<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>配配色</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 工具頁：霧白底＋白卡片。外框不帶顏色，畫面上的色彩只來自照片取出的那四個色 */
/* 左右兩個面板撐滿整個畫面：左邊是色票（照片、四色、收藏），右邊是預覽舞台。手機改成上下排 */
:root {
  --c-lime: #D9E86B;  --c-lime-soft: #F4F8D2;  --c-lime-deep: #7C8A1F;
  --c-rose: #F68FDB;  --c-rose-soft: #FDE3ED;  --c-rose-deep: #B8466F;
  --c-bg: #F9FAFC;  --c-surface: #FFFFFF;  --c-line: #ECE9F1;
  --c-text: #2A2433;  --c-text-2: #6E6878;  --c-text-3: #9C96A6;
  --c-overlay: rgba(42, 36, 51, 0.5);
  --radius-sm: 10px;  --radius-md: 16px;  --radius-pill: 999px;
  --font-sans: "Huninn", "jf-openhuninn-2.1", "PingFang TC", "Noto Sans TC", sans-serif;
  --fs-h1: 32px;  --fs-h2: 22px;  --fs-h3: 18px;  --fs-body: 16px;  --fs-sm: 14px;  --fs-tag: 13px;
  --lh-title: 1.35;  --lh-h2: 1.4;  --lh-body: 1.75;  --lh-sm: 1.7;  --lh-ui: 1.4;
  --gap: 24px;
  color-scheme: light;
}
@media (max-width: 480px) { :root { --fs-h1: 28px; --fs-h2: 20px; --gap: 16px; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font-sans); font-weight: 400; font-synthesis: none;
  background: var(--c-bg); color: var(--c-text);
  font-size: var(--fs-body); line-height: var(--lh-body); letter-spacing: normal;
  line-break: strict; overflow-x: clip;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--c-text); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; word-break: keep-all; }
p { margin: 0; text-wrap: pretty; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1160px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-left, 0px)) 64px; display: flex; flex-direction: column; gap: var(--gap); }
.top { display: flex; flex-direction: column; gap: 4px; }
h1 { font-size: var(--fs-h1); line-height: var(--lh-title); }
.hint { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--c-text-2); }

/* 版面：左右兩欄的算式 —— 1160 − 2×16 邊距 = 1128；440 + 24 + 664 = 1128 */
.stage { display: grid; gap: var(--gap); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) {
  .wrap { padding-inline: 16px; }
  .stage { grid-template-columns: 440px minmax(0, 1fr); align-items: start; }
  .coll { grid-column: 1 / -1; }
  .prev { position: sticky; top: 24px; }
}

.card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-md); padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); }

/* 照片 */
.photo { position: relative; margin: 0; border-radius: var(--radius-sm); overflow: hidden; background: var(--c-bg); aspect-ratio: 4 / 3; display: grid; place-items: center; }
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pins { position: absolute; }
.pins[hidden] { display: none; }
.pin { position: absolute; width: 32px; height: 34px; margin: -33px 0 0 -16px; padding: 0; border: 0; background: none; cursor: grab; touch-action: none; }
.pin svg { display: block; width: 32px; height: 34px; }
.pin:hover svg, .pin.dragging svg { transform: scale(1.12); transform-origin: 50% 100%; }
.pin.dragging { cursor: grabbing; }
.pin:focus-visible { outline: 2px solid var(--c-text); outline-offset: 2px; border-radius: 50%; }
.photo.drag::after { content: "放開就換這張"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(249, 250, 252, 0.9); border: 1.5px dashed var(--c-text); border-radius: var(--radius-sm); font-size: var(--fs-body); }
.photo figcaption[hidden] { display: none; }
.photo figcaption { position: absolute; left: 8px; bottom: 8px; padding: 0 8px; height: 24px; display: inline-flex; align-items: center; border-radius: var(--radius-pill); background: var(--c-surface); color: var(--c-text-2); font-size: var(--fs-sm); line-height: 1; }
.photo-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* 比例條：寬度就是比例 */
.bar { display: flex; height: 56px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--c-line); }
.bar span { min-width: 3px; height: 100%; transition: flex-grow 0.3s ease; }

/* 四色一列一個 */
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "sw hex pct" "role role role"; gap: 10px 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--c-line); }
.row:first-child { border-top: 0; padding-top: 4px; }
.sw { grid-area: sw; position: relative; width: 44px; height: 44px; border-radius: var(--radius-sm); border: 1px solid rgba(42, 36, 51, 0.12); cursor: pointer; overflow: hidden; }
.sw input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; }
.sw svg { position: absolute; right: 4px; bottom: 4px; width: 14px; height: 14px; pointer-events: none; }
.sw:focus-within { outline: 2px solid var(--c-text); outline-offset: 2px; }
.hex { grid-area: hex; justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; margin-left: -10px; border: 0; border-radius: var(--radius-sm); background: none; font-size: var(--fs-body); line-height: 1; }
.hex:hover { background: var(--c-bg); }
.hex svg { width: 16px; height: 16px; color: var(--c-text-2); }
.pct { grid-area: pct; font-size: 24px; line-height: 1.2; }
.pct small { font-size: var(--fs-sm); color: var(--c-text-2); margin-left: 2px; }

/* 角色：四格切換，四個角色分給四個顏色 */
.roles { grid-area: role; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 2px; border: 1px solid var(--c-line); border-radius: var(--radius-pill); background: var(--c-bg); }
.role { height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--c-text-2); font-size: var(--fs-sm); line-height: 1; white-space: nowrap; }
.role svg { width: 16px; height: 16px; flex: none; }
.role[aria-checked="true"] { background: var(--c-text); color: #FFFFFF; }
.role:not([aria-checked="true"]):hover { color: var(--c-text); }

/* 按鈕 */
.btn { height: 44px; padding: 0 20px; border-radius: var(--radius-sm); border: 1px solid var(--c-text); background: var(--c-surface); color: var(--c-text); font-size: var(--fs-body); line-height: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--c-lime); border-color: var(--c-lime); }
.btn.primary:hover { background: radial-gradient(80% 120% at 50% 50%, var(--c-lime-soft) 0%, var(--c-lime) 70%); }
.btn:disabled { background: var(--c-surface); border-color: var(--c-line); color: var(--c-text-3); cursor: not-allowed; }
.pill { height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--c-line); background: var(--c-surface); color: var(--c-text-2); font-size: var(--fs-sm); line-height: 1; display: inline-flex; align-items: center; gap: 6px; }
.pill:hover { color: var(--c-text); border-color: var(--c-text-3); }
.pill svg { width: 16px; height: 16px; }
.pill.danger:hover { color: var(--c-rose-deep); border-color: var(--c-rose-deep); }

/* 分段切換：網站／海報／商品 */
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--c-line); border-radius: var(--radius-pill); background: var(--c-bg); }
.seg button { height: 36px; padding: 0 16px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--c-text-2); font-size: var(--fs-sm); line-height: 1; display: inline-flex; align-items: center; gap: 6px; }
.seg button svg { width: 16px; height: 16px; }
.seg button[aria-selected="true"] { background: var(--c-text); color: #FFFFFF; }

/* 預覽 */
.view { border-radius: var(--radius-sm); overflow: hidden; background: var(--c-bg); display: grid; place-items: center; }
.view svg { display: block; width: 100%; height: auto; }
.view.poster { padding: 20px 0; }
.view.poster svg { width: min(100%, 300px); box-shadow: 0 1px 0 var(--c-line); }
.save-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.status { font-size: var(--fs-sm); line-height: var(--lh-ui); color: var(--c-text-2); min-height: 1.4em; }
.status.ok { color: var(--c-lime-deep); }
.status.err { color: var(--c-rose-deep); }

/* 收藏 */
.list { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 900px) { .list { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.saved { border: 1px solid var(--c-line); border-radius: var(--radius-md); padding: 12px; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: start; }
.saved.on { border-color: var(--c-text); }
.saved img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--radius-sm); display: block; background: var(--c-bg); }
.saved .mini { display: flex; height: 24px; border-radius: 6px; overflow: hidden; }
.saved .mini span { height: 100%; }
.saved .meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.saved .codes { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--c-text-2); display: flex; flex-wrap: wrap; gap: 0 12px; }
.saved .pair { white-space: nowrap; }
.saved .date { font-size: var(--fs-sm); line-height: 1.4; color: var(--c-text-2); }
.saved .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.empty { padding: 24px; border: 1.5px dashed var(--c-line); border-radius: var(--radius-md); text-align: center; color: var(--c-text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); }

/* 彈窗 */
.modal { position: fixed; inset: 0; z-index: 50; background: var(--c-overlay); display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal-card { position: relative; width: min(100%, 360px); background: var(--c-surface); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.modal-card h2 { font-size: 20px; }
.modal-card .actions { display: flex; gap: 8px; margin-top: 8px; }
.modal-card .actions .btn { flex: 1; }
.btn.warn { background: var(--c-rose-soft); border-color: var(--c-rose-deep); color: var(--c-rose-deep); }
.close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--c-line); background: var(--c-surface); display: grid; place-items: center; padding: 0; }
.close svg { width: 16px; height: 16px; }

.foot { font-size: var(--fs-tag); line-height: 1.7; color: var(--c-text-2); text-align: center; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }


/* ───── 網頁、Banner 預覽 ───── */
/* 網頁預覽的工具選單：在畫布裡、靠右，可以收合 */
.tools { position: absolute; z-index: 4; top: 12px; right: 12px; width: 280px; max-height: calc(100% - 24px); display: flex; flex-direction: column; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-md); box-shadow: 0 8px 24px rgba(42, 36, 51, 0.12); }
.tools[hidden] { display: none; }
.tools-toggle { flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: none; color: var(--c-text); font-size: var(--fs-body); line-height: 1; }
.tools-toggle svg { width: 18px; height: 18px; transition: transform 0.2s; }
.tools-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }
.tools:has(.tools-toggle[aria-expanded="false"]) { width: auto; }
.tools-body { overflow: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.tools-body[hidden] { display: none; }
.tl-h { margin: 0 0 8px; font-size: var(--fs-sm); line-height: 1.4; color: var(--c-text-2); }
.tl-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tl-opts button { position: relative; min-height: 40px; padding: 0 10px 0 30px; border: 1px solid var(--c-line); border-radius: var(--radius-sm); background: var(--c-surface); color: var(--c-text); font-size: var(--fs-sm); line-height: 1.3; text-align: left; }
.tl-opts button::before { content: ""; position: absolute; left: 10px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border: 1.5px solid var(--c-text-3); border-radius: 50%; box-sizing: border-box; }
.tl-opts button:hover { border-color: var(--c-text-3); }
.tl-opts button[aria-checked="true"] { background: var(--c-text); border-color: var(--c-text); color: #FFFFFF; }
.tl-opts button[aria-checked="true"]::before { border: 0; background: var(--c-lime); }
.tl-pal { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tl-pal li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.tl-pal i { width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(42, 36, 51, 0.12); }
.tl-pal span { font-size: var(--fs-sm); color: var(--c-text-2); }
.tl-hex { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: none; color: var(--c-text); font-size: var(--fs-sm); }
.tl-hex:hover { background: var(--c-bg); }
.tl-hex svg, .tl-all svg { width: 15px; height: 15px; color: var(--c-text-2); }
.tl-all { margin-top: 8px; width: 100%; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--c-text); border-radius: var(--radius-sm); background: var(--c-surface); color: var(--c-text); font-size: var(--fs-sm); }
@media (min-width: 900px) { .scene.tools-open .view.web, .scene.tools-open .view.art { padding-right: 308px; } }
/* 海報、Banner：一張畫布，照真實尺寸排，再縮放放進來；版面用 cq 單位跟著尺寸變 */
.scene .view.art { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 16px; overflow: auto; }
.art-wrap { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.art-box { position: relative; overflow: hidden; box-shadow: 0 1px 2px rgba(42, 36, 51, 0.08), 0 12px 32px rgba(42, 36, 51, 0.12); }
.art-canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; container: art / size; font-size: 16px; line-height: 1.5; }
.art-wrap figcaption { font-size: 14px; line-height: 1.4; color: var(--c-text-2); }
.ab { position: absolute; inset: 0; overflow: hidden; }
.ab .mk-ph { width: 100%; height: 100%; background-size: cover; }
.ab .cta { display: inline-flex; align-items: center; justify-content: center; gap: 2cqmin; white-space: nowrap; border-radius: 999px; }

/* 日式選物：小 logo、大照片、寬字距標題、底部色帶 */
.ab-shop { display: grid; grid-template: "hd" auto "ph" minmax(0, 1fr) "tx" auto "bd" auto / minmax(0, 1fr); gap: 4cqmin; padding: 6cqmin 7cqmin 0; }
.ab-shop .hd { grid-area: hd; display: flex; align-items: center; gap: 2cqmin; font-size: 3.4cqmin; letter-spacing: 0.25em; }
.mk.ab-shop .hd svg { width: 9cqmin; height: 9cqmin; }
.ab-shop .ph { grid-area: ph; min-height: 0; }
.ab-shop .tx { grid-area: tx; display: flex; justify-content: space-between; align-items: flex-end; gap: 4cqmin; }
.ab-shop .t { font-size: 8.6cqmin; line-height: 1.2; letter-spacing: 0.12em; white-space: nowrap; margin-bottom: 2cqmin !important; }
.ab-shop .d { font-size: 3.2cqmin; line-height: 1.9; letter-spacing: 0.1em; }
.ab-shop .cta { padding: 1.6cqmin 4.5cqmin; border: 0.4cqmin solid currentColor; font-size: 3.4cqmin; letter-spacing: 0.15em; }
.ab-shop .bd { grid-area: bd; margin: 2cqmin -7cqmin 0 !important; padding: 3cqmin 7cqmin; font-size: 3.4cqmin; letter-spacing: 0.2em; }
@container art (min-aspect-ratio: 5/4) {
  .ab-shop { grid-template: "ph hd" auto "ph tx" minmax(0, 1fr) "bd bd" auto / 54% minmax(0, 1fr); column-gap: 6cqmin; }
  .ab-shop .ph { margin-bottom: 0; }
  .ab-shop .tx { flex-direction: column; align-items: flex-start; justify-content: flex-end; padding-bottom: 2cqmin; }
}
@container art (min-aspect-ratio: 5/2) {
  .ab-shop { grid-template: "hd ph tx" minmax(0, 1fr) / auto 20% minmax(0, 1fr); align-items: center; gap: 5cqmin; padding: 8cqmin 6cqmin; }
  .ab-shop .hd span, .ab-shop .bd, .ab-shop .d { display: none; }
  .mk.ab-shop .hd svg { width: 30cqmin; height: 30cqmin; }
  .ab-shop .ph { height: 100%; }
  .ab-shop .tx { flex-direction: row; align-items: center; justify-content: space-between; padding: 0; }
  .ab-shop .t { font-size: 24cqmin; letter-spacing: 0.08em; margin: 0 !important; }
  .ab-shop .tx { gap: 3cqmin; }
  .ab-shop .cta { font-size: 9cqmin; padding: 3cqmin 7cqmin; border-width: 1cqmin; letter-spacing: 0.05em; }
}

/* 大字報：超大英文字、手寫曲線、歪斜照片、貼紙按鈕 */
.ab-bold .en { position: absolute; left: 6cqmin; top: 5cqmin; z-index: 1; font-size: 23cqmin; line-height: 0.86; letter-spacing: -0.03em; }
.mk.ab-bold .swash { position: absolute; z-index: 2; left: 34%; top: 20%; width: 60%; }
.ab-bold .eyes { position: absolute; z-index: 2; left: 8cqmin; top: 2cqmin; display: flex; gap: 0.4cqmin; transform: rotate(-12deg); }
.ab-bold .eyes i { position: relative; width: 7cqmin; height: 8.4cqmin; border-radius: 50%; border: 1.2cqmin solid; }
.ab-bold .eyes b { position: absolute; right: 1cqmin; top: 1.6cqmin; width: 2.4cqmin; height: 2.4cqmin; border-radius: 50%; }
.ab-bold .ph { position: absolute; z-index: 3; right: 7%; top: 44%; width: 56%; height: 30%; border: 1.6cqmin solid; transform: rotate(5deg); }
.ab-bold .tx { position: absolute; z-index: 4; left: 6cqmin; right: 6cqmin; bottom: 6cqmin; }
.ab-bold .t { font-size: 11cqmin; line-height: 1.15; }
.ab-bold .d { font-size: 3.6cqmin; margin: 1.5cqmin 0 4cqmin !important; }
.ab-bold .cta { padding: 2.4cqmin 6cqmin; border-radius: 0; font-size: 4cqmin; transform: rotate(-4deg); }
@container art (min-aspect-ratio: 5/4) {
  .ab-bold .en { font-size: 22cqmin; }
  .ab-bold .ph { right: 5%; top: 14%; width: 34%; height: 62%; }
  .mk.ab-bold .swash { left: 18%; top: 34%; width: 42%; }
  .ab-bold .tx { right: 50%; }
}
@container art (min-aspect-ratio: 5/2) {
  .ab-bold .en { top: 50%; transform: translateY(-50%); font-size: 40cqmin; }
  .ab-bold .eyes, .mk.ab-bold .swash, .ab-bold .d { display: none; }
  .ab-bold .ph { right: 4%; top: 12%; width: 22%; height: 76%; border-width: 3cqmin; }
  .ab-bold .tx { left: 44%; right: 30%; top: 50%; bottom: auto; transform: translateY(-50%); display: flex; align-items: center; justify-content: space-between; gap: 6cqmin; }
  .ab-bold .t { font-size: 22cqmin; }
  .ab-bold .cta { font-size: 10cqmin; padding: 5cqmin 10cqmin; }
}

/* 安靜留白：方塊 logo 疊在照片上、直排日期、置中的字 */
.ab-calm { display: grid; grid-template: "bg" auto "ph" minmax(0, 1fr) "tx" auto / minmax(0, 1fr); padding: 7cqmin 11cqmin 8cqmin; text-align: center; }
.ab-calm .bg { grid-area: bg; justify-self: center; position: relative; z-index: 2; width: 20cqmin; height: 16cqmin; margin-bottom: -8cqmin; font-size: 3.6cqmin; border-radius: 0 0 4cqmin 0; }
.ab-calm .ph { grid-area: ph; min-height: 0; border-radius: 0 0 9cqmin 0; overflow: hidden; }

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const INK = "#2A2433", WHITE = "#FFFFFF";
  const STORE = "palette-tool:collection";

  // ───── 角色：四個角色、四個不同的圖示 ─────
  const ROLES = [
    { id: "main", name: "主色", icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="currentColor"/></svg>' },
    { id: "sub", name: "輔色", icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>' },
    { id: "base", name: "底色", icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 9.5h11v2a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2z" fill="currentColor"/></svg>' },
    { id: "accent", name: "強調", icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l1.6 4.9 4.9 1.6-4.9 1.6L8 14.5l-1.6-4.9L1.5 8l4.9-1.6z" fill="currentColor"/></svg>' },
  ];
  const roleName = (id) => ROLES.find((r) => r.id === id).name;

  // ───── 顏色換算 ─────
  const toHex = (rgb) => "#" + rgb.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("").toUpperCase();
  const fromHex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const lin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  function lab([r, g, b]) {
    const R = lin(r), G = lin(g), B = lin(b);
    let x = (R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047, y = R * 0.2126 + G * 0.7152 + B * 0.0722, z = (R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883;
    const f = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
    x = f(x); y = f(y); z = f(z);
    return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
  }
  const dE = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const luminance = (hex) => { const [r, g, b] = fromHex(hex).map(lin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const contrast = (a, b) => { const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  // 放在某個底色上的字：墨色或白色，挑對比高的
  const textOn = (bg) => (contrast(bg, INK) >= contrast(bg, WHITE) ? INK : WHITE);
  // 想用某色當字，對比不夠就退回墨色或白色
  const readable = (fg, bg, min = 3) => (contrast(fg, bg) >= min ? fg : textOn(bg));

  // ───── 取色：Lab 空間 k-means 分 8 群，再挑四個彼此差夠多的顏色 ─────
  function extract(img) {
    const W = 160, H = Math.max(1, Math.round((img.naturalHeight || img.height) * W / (img.naturalWidth || img.width)));
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(img, 0, 0, W, H);
    const d = x.getImageData(0, 0, W, H).data, px = [], pl = [];
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 128) continue; px.push([d[i], d[i + 1], d[i + 2]]); pl.push(lab([d[i], d[i + 1], d[i + 2]])); }
    if (px.length < 16) throw new Error("圖片太小或全透明");
    // k-means++ 起點，用固定種子：同一張圖每次結果一樣
    let seed = 404; const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
    const K = 8, cen = [pl[Math.floor(rnd() * pl.length)]];
    while (cen.length < K) {
      const dist = pl.map((p) => Math.min(...cen.map((q) => dE(p, q))) ** 2), sum = dist.reduce((a, b) => a + b, 0);
      let t = rnd() * sum, i = 0; while (t > dist[i] && i < dist.length - 1) { t -= dist[i]; i++; }
      cen.push(pl[i]);
    }
    const asg = new Int16Array(pl.length);
    for (let it = 0; it < 12; it++) {
      for (let i = 0; i < pl.length; i++) { let best = 0, bd = Infinity; for (let k = 0; k < K; k++) { const v = dE(pl[i], cen[k]); if (v < bd) { bd = v; best = k; } } asg[i] = best; }
      const acc = cen.map(() => [0, 0, 0, 0]);
      for (let i = 0; i < pl.length; i++) { const a = acc[asg[i]]; a[0] += pl[i][0]; a[1] += pl[i][1]; a[2] += pl[i][2]; a[3]++; }
      acc.forEach((a, k) => { if (a[3]) cen[k] = [a[0] / a[3], a[1] / a[3], a[2] / a[3]]; });
    }
    // 每群的代表色用群內像素的 RGB 平均，比從 Lab 換回去準
    const groups = cen.map(() => ({ n: 0, r: 0, g: 0, b: 0 }));
    for (let i = 0; i < px.length; i++) { const gp = groups[asg[i]]; gp.n++; gp.r += px[i][0]; gp.g += px[i][1]; gp.b += px[i][2]; }
    const clusters = groups.map((gp, k) => gp.n ? { rgb: [gp.r / gp.n, gp.g / gp.n, gp.b / gp.n], lab: cen[k], n: gp.n } : null).filter(Boolean).sort((a, b) => b.n - a.n);
    // 相近色合併：從大群往小群挑，跟已挑的色差夠大才收
    let picked = [];
    for (const th of [22, 14, 8, 0]) {
      picked = [];
      for (const cl of clusters) if (picked.every((p) => dE(p.lab, cl.lab) >= th)) picked.push(cl);
      if (picked.length >= 4) break;
    }
    picked = picked.slice(0, 4);
    // 每個像素歸到最近的那四色，算比例；用最大餘數法讓四個加起來剛好 100
    const cnt = picked.map(() => 0);
    for (const p of pl) { let best = 0, bd = Infinity; picked.forEach((q, k) => { const v = dE(p, q.lab); if (v < bd) { bd = v; best = k; } }); cnt[best]++; }
    const raw = cnt.map((n) => (n * 100) / pl.length), pct = raw.map(Math.floor);
    raw.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]).slice(0, 100 - pct.reduce((a, b) => a + b, 0)).forEach(([, i]) => pct[i]++);
    const colors = picked.map((p, i) => ({ hex: toHex(p.rgb), pct: pct[i] })).sort((a, b) => b.pct - a.pct);
    console.assert(colors.reduce((a, c) => a + c.pct, 0) === 100, "四色比例加起來不是 100");
    return colors;
  }

  // 預設角色不看比例：最亮又低彩度的當底色、最鮮豔的當強調、剩下較有份量的當主色
  function defaultRoles(colors) {
    const info = colors.map((c, i) => { const [L, a, b] = lab(fromHex(c.hex)); return { i, L, C: Math.hypot(a, b), pct: c.pct }; });
    const left = new Set(info.map((x) => x.i)), roles = [];
    const take = (score) => { const best = [...left].map((i) => info[i]).sort((p, q) => score(q) - score(p))[0]; left.delete(best.i); return best.i; };
    roles[take((x) => x.L - x.C * 0.8)] = "base";
    roles[take((x) => x.C)] = "accent";
    roles[take((x) => x.pct + x.C * 0.1)] = "main";
    roles[[...left][0]] = "sub";
    return roles;
  }

  // ───── 狀態 ─────
  const S = { colors: [], roles: [], view: "web", src: "", sample: true, active: null };
  const byRole = (id) => S.colors[S.roles.indexOf(id)].hex;
  function setStatus(t, kind = "") { const el = $("#status"); el.textContent = t; el.className = "status " + kind; }

  // ───── 範例圖：程式畫的一盤水果，打開就有顏色可以玩 ─────
  function sampleImage() {
    const c = document.createElement("canvas"); c.width = 640; c.height = 480;
    const x = c.getContext("2d");
    x.fillStyle = "#F1E9DA"; x.fillRect(0, 0, 640, 480);
    x.fillStyle = "#E6DCC9"; x.fillRect(0, 330, 640, 150);
    x.fillStyle = "#2F3B5C"; x.beginPath(); x.ellipse(330, 330, 230, 70, 0, 0, 7); x.fill();
    x.fillStyle = "#3B4870"; x.beginPath(); x.ellipse(330, 322, 190, 52, 0, 0, 7); x.fill();
    const fruit = (cx, cy, r, col, hi) => { x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.fillStyle = hi; x.beginPath(); x.arc(cx - r * 0.35, cy - r * 0.35, r * 0.25, 0, 7); x.fill(); };
    fruit(250, 250, 78, "#D8442E", "#E8735D"); fruit(380, 262, 64, "#D8442E", "#E8735D");
    fruit(470, 290, 46, "#F2C14E", "#F7D888");
    x.fillStyle = "#5E8C4A"; x.beginPath(); x.ellipse(300, 168, 46, 18, -0.5, 0, 7); x.fill();
    x.beginPath(); x.ellipse(420, 196, 34, 13, 0.6, 0, 7); x.fill();
    // 一點顆粒，像照片
    const d = x.getImageData(0, 0, 640, 480);
    let s = 7; for (let i = 0; i < d.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = ((s / 2147483647) - 0.5) * 14; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; }
    x.putImageData(d, 0, 0);
    return c.toDataURL("image/jpeg", 0.85);
  }

  // ───── 讀圖、取色 ─────
  function loadSrc(src, sample) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        try {
          S.colors = extract(img); S.roles = defaultRoles(S.colors); S.src = src; S.sample = sample; S.active = null;
          readPix(img); locate(); S.orig = clone(S.colors);
          $("#photo-img").src = src; $("#photo-img").alt = sample ? "範例圖片：一盤番茄、檸檬和葉子" : "你選的照片";
          $("#photo-cap").hidden = !sample;
          renderAll(); res();
        } catch (e) { rej(e); }
      };
      img.onerror = () => rej(new Error("讀不了"));
      img.src = src;
    });
  }
  async function useFile(f) {
    if (!f || !/^image\//.test(f.type || "image/")) { setStatus("這個檔案讀不了，換一張 JPG 或 PNG", "err"); return; }
    setStatus("取色中⋯");
    const url = URL.createObjectURL(f);
    try { await loadSrc(url, false); setStatus("取好了，四個顏色都可以換角色", "ok"); }
    catch { setStatus("這張圖讀不了，換一張 JPG 或 PNG", "err"); }
  }

  const hsl = (hex) => {
    let [r, g, b] = fromHex(hex).map((v) => v / 255);
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    let h = 0, s = 0;
    if (mx !== mn) {

  ];
  function scheme(type, c) {
    const all = [c.P, c.S, c.B, c.A];
    const darkest = all.reduce((a, b) => (lum(b) < lum(a) ? b : a));
    const lightest = all.reduce((a, b) => (lum(b) > lum(a) ? b : a));
    const byChroma = [...all].sort((a, b) => chroma(b) - chroma(a));
    let o;
    if (type === "vivid") {
      // 四個顏色原色照用，每個都是一大塊
      const bg = lum(lightest) > 0.86 ? lightest : tint(lightest, 0.7);
      o = { bg, surface: tint(lightest, 0.9), c1: c.P, c2: c.A, c3: c.S, c4: contrast(c.B, bg) < 1.25 ? shade(c.B, 0.18) : c.B, used: all };

      const others = all.filter((x) => x !== c.P);

      const near = (pool.length ? pool : others).reduce((a, b) => (hueGap(b, c.P) < hueGap(a, c.P) ? b : a));
      o = { bg: tint(c.P, 0.9), surface: tint(c.P, 0.96), c1: c.P, c2: near, c3: shade(c.P, 0.3), c4: tint(near, 0.45), used: [c.P, near] };

      let bg = darkest; for (let i = 0; i < 12 && lum(bg) > 0.13; i++) bg = shade(bg, 0.15);
      const pop = byChroma.filter((x) => x !== darkest);
      o = { bg, surface: mix(bg, lightest, 0.1), c1: fit(pop[0], bg, 4.5), c2: fit(pop[1] || lightest, bg, 3), c3: fit(lightest, bg, 7), c4: fit(tint(pop[0], 0.4), bg, 4.5), ink: fit(lightest, bg, 10), used: [darkest, lightest, ...pop.slice(0, 2)] };
    } else {

    o.on = (bg) => (contrast(bg, o.ink) >= contrast(bg, alt) ? o.ink : alt);

    return o;

  function sampleAt(fx, fy) {
    const { W, H, d, ok } = PIX, cx = Math.min(W - 1, Math.floor(fx * W)), cy = Math.min(H - 1, Math.floor(fy * H)), s = [0, 0, 0, 0];
    for (let y = cy - 1; y <= cy + 1; y++) for (let x = cx - 1; x <= cx + 1; x++) {
      if (x < 0 || y < 0 || x >= W || y >= H) continue; const p = y * W + x; if (!ok[p]) continue;
      s[0] += d[p * 4]; s[1] += d[p * 4 + 1]; s[2] += d[p * 4 + 2]; s[3]++;
    }
    return s[3] ? toHex([s[0] / s[3], s[1] / s[3], s[2] / s[3]]) : null;
  }
  // 圖片用 contain 放進框裡，圖釘層要對齊圖片實際的位置
  function placePinLayer() {
    const fig = $("#photo"), lay = $("#pins"); if (!PIX) { lay.hidden = true; return; }
    const fw = fig.clientWidth, fh = fig.clientHeight, r = PIX.ratio;
    const w = fw / fh > r ? fh * r : fw, h = fw / fh > r ? fh : fw / r;
    Object.assign(lay.style, { left: `${(fw - w) / 2}px`, top: `${(fh - h) / 2}px`, width: `${w}px`, height: `${h}px` });
    lay.hidden = false;
  }
  const pinSVG = (hex) => `<svg viewBox="0 0 32 34" aria-hidden="true"><path d="M16 33S4 22.5 4 13.5a12 12 0 0 1 24 0C28 22.5 16 33 16 33z" fill="#FFFFFF" stroke="rgba(42,36,51,.35)"/><circle cx="16" cy="13.5" r="8.5" fill="${hex}"/></svg>`;
  function renderPins() {
    const lay = $("#pins");
    if (!PIX || S.colors.some((c) => c.x == null)) { lay.innerHTML = ""; lay.hidden = true; return; }
    lay.innerHTML = S.colors.map((c, i) => `<button type="button" class="pin" data-pin="${i}" style="left:${c.x * 100}%;top:${c.y * 100}%" aria-label="${roleName(S.roles[i])} ${c.hex} 的取色點，拖動或用方向鍵移動">${pinSVG(c.hex)}</button>`).join("");
    placePinLayer();
  }
  new ResizeObserver(() => placePinLayer()).observe($("#photo"));
  const edited = () => S.orig && S.colors.some((c, i) => c.hex !== S.orig[i]?.hex);
  const clone = (cs) => cs.map((c) => ({ ...c }));
  let pinRaf = 0;
  function pinMoved(i, fx, fy, done) {
    const c = S.colors[i]; c.x = Math.min(1, Math.max(0, fx)); c.y = Math.min(1, Math.max(0, fy));
    const hex = sampleAt(c.x, c.y); if (hex) c.hex = hex;
    const el = $(`#pins [data-pin="${i}"]`);
    if (el) { el.style.left = `${c.x * 100}%`; el.style.top = `${c.y * 100}%`; el.querySelector("circle").setAttribute("fill", c.hex); el.setAttribute("aria-label", `${roleName(S.roles[i])} ${c.hex} 的取色點，拖動或用方向鍵移動`); }
    cancelAnimationFrame(pinRaf);
    pinRaf = requestAnimationFrame(() => { if (done) recount(); S.active = null; renderRows(); renderView(); if (done) renderList(); });
  }
  let drag = null;
  $("#pins").addEventListener("pointerdown", (e) => {
    const b = e.target.closest(".pin"); if (!b) return;
    e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add("dragging"); b.focus();
    drag = { i: Number(b.dataset.pin), r: $("#pins").getBoundingClientRect() };
  });
  $("#pins").addEventListener("pointermove", (e) => { if (drag) pinMoved(drag.i, (e.clientX - drag.r.left) / drag.r.width, (e.clientY - drag.r.top) / drag.r.height, false); });
  const endDrag = (e) => {
    if (!drag) return; const { i, r } = drag; drag = null;
    e.target.closest(".pin")?.classList.remove("dragging");
    pinMoved(i, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, true);
    setStatus(`取了照片上的 ${S.colors[i].hex}`, "ok");
  };
  $("#pins").addEventListener("pointerup", endDrag);
  $("#pins").addEventListener("pointercancel", endDrag);
  $("#pins").addEventListener("keydown", (e) => {
    const b = e.target.closest(".pin"), m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!b || !m) return; e.preventDefault();
    const i = Number(b.dataset.pin), st = e.shiftKey ? 0.05 : 0.01, c = S.colors[i];
    pinMoved(i, c.x + m[0] * st, c.y + m[1] * st, true);
  });
  $("#reset").addEventListener("click", () => {
    if (!S.orig) return;
    S.colors = clone(S.orig); S.active = null;
    renderPalette(); renderView(); renderList();
    setStatus("已復原成系統取的四個顏色", "ok");
  });
  function loadPix(src) {
    const img = new Image();
    img.onload = () => { readPix(img); locate(); S.orig = clone(S.colors); renderPins(); updateReset(); };
    img.src = src;
  }
  function updateReset() { $("#reset").disabled = !edited(); }

  // ───── 收藏：只存在這台瀏覽器 ─────
  const readStore = () => { try { const v = JSON.parse(localStorage.getItem(STORE) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; } };
  const writeStore = (list) => { try { localStorage.setItem(STORE, JSON.stringify(list)); return true; } catch { return false; } };
  const today = () => { const d = new Date(), p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`; };
  function thumb() {
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"), s = 120, k = Math.max(s / img.naturalWidth, s / img.naturalHeight);
        c.width = s; c.height = s;
        c.getContext("2d").drawImage(img, (s - img.naturalWidth * k) / 2, (s - img.naturalHeight * k) / 2, img.naturalWidth * k, img.naturalHeight * k);
        res(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = () => res("");
      img.src = S.src;
    });
  }
  $("#save").addEventListener("click", async () => {
    const list = readStore();
    const item = { id: Date.now().toString(36), date: today(), colors: S.colors.map((c, i) => ({ hex: c.hex, pct: c.pct, role: S.roles[i] })), thumb: await thumb() };
    list.unshift(item);
    if (!writeStore(list)) { setStatus("存不進去，這個瀏覽器可能關掉了本機儲存", "err"); return; }
    S.active = item.id;
    setStatus("✓ 存進收藏了", "ok");
    renderList();
  });

  const roleOrder = (cs) => ROLES.map((r) => cs.find((c) => c.role === r.id)).filter(Boolean);
  function renderList() {
    const list = readStore(), box = $("#list");
    $("#coll-count").textContent = list.length ? `共 ${list.length} 組` : "";
    if (!list.length) { box.className = ""; box.innerHTML = `<p class="empty">還沒有收藏。喜歡上面這組顏色，就按「存進收藏」。</p>`; return; }
    box.className = "list";
    box.innerHTML = list.map((it) => `
      <article class="saved ${it.id === S.active ? "on" : ""}" aria-label="${it.date} 的配色">
        ${it.thumb ? `<img src="${esc(it.thumb)}" alt="">` : `<img alt="">`}
        <div class="meta">
          <div class="mini" aria-hidden="true">${it.colors.map((c) => `<span style="background:${esc(c.hex)};flex-grow:${Number(c.pct) || 1}"></span>`).join("")}</div>
          <div class="codes num">${roleOrder(it.colors).map((c) => `<span class="pair">${roleName(c.role)} ${esc(c.hex)}</span>`).join(" ")}</div>
          <div class="date num">${esc(it.date)} 存</div>
        </div>
        <div class="acts">
          <button type="button" class="pill" data-apply="${esc(it.id)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>套用</button>
          <button type="button" class="pill" data-export="${esc(it.id)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>存成圖片</button>
          <button type="button" class="pill danger" data-del="${esc(it.id)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>刪除</button>
        </div>
      </article>`).join("");
  }
  $("#list").addEventListener("click", (e) => {
    const list = readStore(), b = e.target.closest("button"); if (!b) return;
    const it = list.find((x) => x.id === (b.dataset.apply || b.dataset.export || b.dataset.del)); if (!it) return;
    if (b.dataset.apply) {
      S.colors = it.colors.map((c) => ({ hex: c.hex, pct: c.pct })); S.roles = it.colors.map((c) => c.role); S.active = it.id;
      if (it.thumb) { S.src = it.thumb; S.sample = false; $("#photo-img").src = it.thumb; $("#photo-img").alt = `${it.date} 存的照片縮圖`; $("#photo-cap").hidden = true; }
      PIX = null; S.orig = clone(S.colors); if (it.thumb) loadPix(it.thumb);
      renderAll(); setStatus(`已套用 ${it.date} 的配色`, "ok");
      $("#h-src").scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    }
    if (b.dataset.export) exportPNG(it.colors, it.date);
    if (b.dataset.del) askDelete(it.id, b);
  });

  // 刪除前確認
  let pendingDel = null, lastFocus = null;
  function askDelete(id, from) { pendingDel = id; lastFocus = from; $("#confirm").hidden = false; $("#c-cancel").focus(); }
  const closeConfirm = () => { $("#confirm").hidden = true; pendingDel = null; lastFocus?.focus?.(); };
  $("#c-cancel").addEventListener("click", closeConfirm);
  $("#c-close").addEventListener("click", closeConfirm);
  $("#confirm").addEventListener("click", (e) => { if (e.target.id === "confirm") closeConfirm(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#confirm").hidden) closeConfirm(); });
  $("#c-ok").addEventListener("click", () => {
    writeStore(readStore().filter((x) => x.id !== pendingDel));
    if (S.active === pendingDel) S.active = null;
    $("#confirm").hidden = true; pendingDel = null;
    setStatus("刪掉了"); renderList(); $("#h-coll").focus?.();
  });

  // ───── 存成圖片：一張色卡 PNG ─────
  async function exportPNG(cols, date) {
    try {
      await Promise.race([document.fonts.load('400 40px "Huninn"', "配色我的主色輔色底色強調比例存0123456789#ABCDEF%."), new Promise((r) => setTimeout(r, 1200))]);
      const W = 1080, H = 1350, P = 80, c = document.createElement("canvas"); c.width = W; c.height = H;
      const x = c.getContext("2d"), f = (s) => `400 ${s}px Huninn, "PingFang TC", sans-serif`;
      x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, W, H);
      x.fillStyle = INK; x.font = f(56); x.fillText("我的配色", P, P + 56);
      x.fillStyle = "#6E6878"; x.font = f(30); x.fillText(date, P, P + 112);
      let bx = P; const bw = W - P * 2, by = P + 160, bh = 260;
      cols.forEach((col) => { const w = Math.round((bw * col.pct) / 100); x.fillStyle = col.hex; x.fillRect(bx, by, w, bh); bx += w; });
      roleOrder(cols).forEach((col, k) => {
        const y = by + bh + 80 + k * 170;
        x.fillStyle = col.hex; x.beginPath(); x.roundRect(P, y, 120, 120, 20); x.fill();
        x.strokeStyle = "rgba(42,36,51,.12)"; x.lineWidth = 2; x.stroke();
        x.fillStyle = INK; x.font = f(44); x.fillText(roleName(col.role), P + 160, y + 52);
        x.fillStyle = "#6E6878"; x.font = f(34); x.fillText(col.hex, P + 160, y + 104);
        x.fillStyle = INK; x.font = f(56); x.textAlign = "right"; x.fillText(`${col.pct}%`, W - P, y + 82); x.textAlign = "left";
      });
      x.fillStyle = "#6E6878"; x.font = f(26); x.fillText("404 廚房 · 配配色", P, H - P + 10);
      const blob = await new Promise((r) => c.toBlob(r, "image/png"));
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = `配配色-${date.replace(/\./g, "")}.png`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      setStatus("✓ 存成圖片了", "ok");
    } catch { setStatus("存不了圖片，等一下再試", "err"); }
  }
  $("#export-now").addEventListener("click", () => exportPNG(S.colors.map((c, i) => ({ ...c, role: S.roles[i] })), today()));

  function renderAll() { renderPalette(); renderView(); renderList(); }
  let rz = 0; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => S.colors.length && renderView(), 150); });
  loadSrc(sampleImage(), true).catch(() => setStatus("範例圖讀不了，請換一張照片", "err"));
})();
</script>
